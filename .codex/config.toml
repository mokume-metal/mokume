[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/agent-comment-guard.sh"'
timeout = 10
statusMessage = "コメントの投稿経路を確認中"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/issue-evidence-guard.sh"'
timeout = 10
statusMessage = "Issue の本文に絵か宣言があるか確認中"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/plan-record.sh" codex-stop'
timeout = 30
statusMessage = "プランが GitHub に残ったか確認中"

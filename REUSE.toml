# REUSE (https://reuse.software) の帰属宣言。
# 原則は各ファイルの SPDX ヘッダで宣言し、ヘッダを持てない・持たせたくない
# ファイルだけをここに列挙する。ワイルドカードで将来のファイルを黙って包まない
# (帰属不明のファイルが混入したら reuse lint が落ちるのが望む挙動)。
#
# ここに載せてよいのは「増えないファイル」だけ。数が増えていくファイル群
# (docs/decisions/ の ADR など) は必ず自ファイルのヘッダで宣言する — 独立した
# 変更の帰属宣言がこの配列の同じ位置に集まると、中身が無関係でも 3-way merge が
# conflict と判定し、並行して出せなくなるためである (#149)。Markdown は
# HTML コメントでヘッダを持てる (レンダリング時には見えない)。
#
# **添えファイル (`.license`) は使わない。** あれは中身にヘッダを書けない
# ファイル (画像・バイナリ) のための最後の手段で、このリポジトリにはコミット
# しない。テキストなら必ずヘッダかこの表のどちらかで宣言できるので、3 つ目の
# 経路を開くと同じ帰属が 2 通りの書き方を持つことになる。この規則は外の
# パッケージにも効く (docs/decisions/0026-plugin-repository-alignment.md
# 決定 1 の第 1 段) — 明文が無かったために実際に割れた
# (https://github.com/mokume-metal/mokume-syphon/issues/6)。

# ルートの LICENSE は GitHub / licensee の慣習に応える写しで、正典は
# LICENSES/MIT.txt (REUSE 仕様 3.3 が要求する置き場)。中身が同一なので重複に
# 見えるが、どちらも消せない — LICENSES/MIT.txt を消すと reuse lint が
# Missing licenses で落ち、LICENSE を消すと GitHub のライセンス表示が消える
# (REUSE は LICENSES/ しか見ず、licensee は LICENSES/ を見ない)。著作権年や
# holder を変えるときは両方を同時に変える — reuse lint はどちらのファイルも
# 検査対象に入れないので、ズレても CI は緑のまま通る (#154)。

version = 1

[[annotations]]
path = [
  "README.md",
  "AGENTS.md",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "changelog.d/README.md",
  ".gitignore",
  "Makefile",
  ".claude/settings.json",
  ".github/workflows/ci.yml",
  ".github/workflows/release.yml",
  ".github/workflows/triage.yml",
  ".github/workflows/parent-guard.yml",
  ".github/workflows/close-cleanup.yml",
  ".github/workflows/ruleset-drift.yml",
  ".github/dependabot.yml",
  ".github/CODEOWNERS",
  ".github/rulesets/main-protection.json",
  ".github/rulesets/signed-commits.json",
  ".github/rulesets/release-tags.json",
  ".github/pull_request_template.md",
  ".github/ISSUE_TEMPLATE/bug-report.md",
  ".github/ISSUE_TEMPLATE/proposal.md",
]
SPDX-FileCopyrightText = "2026 mokume-metal"
SPDX-License-Identifier = "MIT"

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # dependabot の PR は Issue に紐づかない (Closes #N を書かない) ため、
    # このラベルが無いと review-gate が毎回赤で止まり、人が手で付けるまで
    # マージできない (ADR-0005 決定 4)。
    #
    # labels は既定を置き換える指定なので、dependabot が既定で付ける
    # dependencies ラベルは付かなくなる — 読み手のいないラベルは持たない
    # (ADR-0005 決定 2)。bot の PR かどうかは author で分かる。
    #
    # bot が自分でゲートを外しているわけではない: no-issue はゲートではなく
    # Issue 紐づけの例外印である。dependabot の PR も他の PR と同じく必須チェック
    # だけで入る (承認は要求しない — ADR-0044)。
    labels: ["no-issue"]
    # PR タイトルを Conventional Commits の形 (ci(deps): bump ...) にする。指定が無いと
    # dependabot は接頭辞をコミット履歴から推測し、外れると素の "Bump ..." で来て
    # pr-title が赤になり、人がタイトルを直すまで queue に入れない (#2125)。
    # ci を選ぶのは、更新対象が GitHub Actions でワークフローだけが変わるため。
    commit-message:
      prefix: "ci"
      include: "scope"

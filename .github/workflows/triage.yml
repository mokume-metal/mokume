name: Triage

# 新規 Issue に status: needs-triage を自動付与し、タイトルの型 (Conventional
# Commits の type) から Issue Type を推定して付与する (ADR-0002 決定 1 / ADR-0004)。
# 雑な起票を妨げないため、起票時には何も要求しない — 分類は機械が下書きする。
#
# 判断は scripts/triage.sh が持つ (検査は scripts/tests/triage_test.py)。issues
# イベントの workflow は既定ブランチのものしか走らないため、ロジックをここへ埋める
# と main に入れるまで誰も確かめられない (#66 で確認した性質)。

# run-name が無いと GitHub は run 名にイベント既定 (issues → Issue タイトル) を使う
# ため、同じタイトルの Issue が複数あるとどの Issue の run か Actions 一覧から辿れ
# ない (#67)。番号を前置して一意にする。
#
# 値のクォートは必須。`#` は YAML のコメント開始文字なので、クォート無しでは値が
# 空になる。`${{ }}` は YAML パース後に評価されるので、Issue タイトル側に `"` や
# `: ` が入っていても壊れない。
#
# このワークフローは on: issues のみを受けるので、#38 の ci.yml のようなイベント
# ごとの条件分岐は要らない。
run-name: "#${{ github.event.issue.number }} ${{ github.event.issue.title }}"

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: needs-triage と Issue Type の自動付与
        env:
          GH_TOKEN: ${{ github.token }}
          # Issue タイトルは起票者が書く値なので、run: に ${{ }} で展開せず環境変数
          # 経由で渡す (展開はシェルの構文解析より前に起きるため、埋め込むと任意の
          # コマンドを実行させられる)
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: bash scripts/triage.sh "$NUM" "$TITLE"

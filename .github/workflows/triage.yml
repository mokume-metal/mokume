name: Triage

# 新規 Issue に status: needs-triage を自動付与し、タイトルの型 (Conventional
# Commits の type) から type: ラベルを推定して付与する (ADR-0002 決定 1)。
# 雑な起票を妨げないため、起票時には何も要求しない — 分類は機械が下書きする。

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: needs-triage と type ラベルの自動付与
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # fast path: 起票時点で verify: が付いている (完了条件が確定済み) なら
          # needs-triage を付けない
          existing=$(gh issue view "$NUM" -R "$REPO" --json labels --jq '[.labels[].name] | join("\n")')
          labels=""
          add() { if [ -z "$labels" ]; then labels="$1"; else labels="$labels,$1"; fi; }
          grep -q '^verify: ' <<<"$existing" || add "status: needs-triage"
          case "$TITLE" in
            "fix:"*|"fix("*)                 add "type: bug" ;;
            "feat:"*|"feat("*)               add "type: feature" ;;
            "docs:"*|"docs("*)               add "type: docs" ;;
            "design:"*|"design("*)           add "type: design" ;;
            "chore:"*|"chore("*|"ci:"*|"ci("*|"build:"*|"build("*|"refactor:"*|"refactor("*|"test:"*|"test("*|"perf:"*|"perf("*) add "type: maintenance" ;;
          esac
          [ -n "$labels" ] && gh issue edit "$NUM" -R "$REPO" --add-label "$labels" || echo "付与するラベルなし"

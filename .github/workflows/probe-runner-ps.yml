# 使い捨て (#3095 の閾値を決めるため・merge しない)。専用機の平常の ppid=1 のプロセスを読む。
name: probe-runner-ps
on:
  pull_request:
    types: [opened]
    paths: [.github/workflows/probe-runner-ps.yml]
permissions:
  contents: read
jobs:
  ps:
    strategy:
      matrix:
        round: [1, 2]
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 5
    steps:
      - name: ppid=1 のプロセス (CPU の多い順に 15)
        run: |
          echo "runner=${RUNNER_NAME} host=$(hostname -s) user=$(id -un) round=${{ matrix.round }}"
          echo "-- pid ppid %cpu etime comm (ppid=1・CPU 順)"
          ps -U "$(id -un)" -o pid=,ppid=,%cpu=,etime=,comm= | awk '$2 == 1' | sort -k3 -nr | sed -n '1,15p' | sed "s#${HOME}#~#g"
          echo "-- 50% 超に当たるもの"
          ps -U "$(id -un)" -o pid=,ppid=,%cpu=,etime=,comm= | awk '$2 == 1 && $3 > 50' | sed "s#${HOME}#~#g"
          echo "-- 全ユーザーの CPU 上位 10 (参考)"
          ps -A -o pid=,ppid=,%cpu=,etime=,user=,comm= | sort -k3 -nr | sed -n '1,10p' | sed "s#${HOME}#~#g"

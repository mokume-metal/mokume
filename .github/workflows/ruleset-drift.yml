name: Ruleset drift

# ブランチ保護のルールセットが .github/rulesets/ の定義とずれていないかを定期検査する
# (ADR-0006 決定 4 / #99)。正本は定義ファイルで、GitHub 側の状態はその写しにすぎない。
#
# ルールセットの状態は PR の内容と独立に変わる (誰かが管理画面で 1 項目変える) —
# それがこの検査の拾いたい事象なので、per-PR の ci-gate 配下には置かない。PR で回るのは
# 定義の「形」だけで、そちらは token の要らない make ci-check の rulesets-shape が担う。
#
# **この検査は bypass_actors を見ていない。** それは ruleset への write access がある
# 認証にしか返らず (#99 で実測)、CI にその鍵を置くと「ルールセットを外せる鍵」を常設
# することになる。検査専用 App を Administration: Read で立てる案は、read-only では
# bypass_actors が見えないと分かった時点で廃した (匿名読み取りと同じものしか見られない)。
# 緑が何を意味するかは照合の出力が名乗る。bypass_actors はメンテナが手元で
# `bash scripts/check-rulesets.sh` を打つときに厳格に照合する。

on:
  schedule:
    # 日次 03:17 UTC (≒ 12:17 JST)。毎時 0 分はランナーが混むので外す
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      issues: write # ドリフト検出時の起票
    steps:
      - uses: actions/checkout@v7

      - name: 定義と実設定を照合する
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/check-rulesets.sh --without-bypass-actors 2>&1 | tee drift.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: ドリフトを起票する
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report-ruleset-drift.sh drift.log

      # 起票の後に落とす。Actions の履歴にも赤が残らないと、Issue を閉じた後に
      # 「いつから直っているか」が run から読めない
      - name: 検査の結果
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          if [ "$STATUS" != "0" ]; then
            echo "ドリフトを検出した (差分は上のログ、対応は起票された Issue)" >&2
            exit 1
          fi
          echo "ok: 定義と実設定は一致している (bypass_actors を除く)"

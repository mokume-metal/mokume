name: Stall watch

# PROBE for #2614 — 使い捨て。merge しない。
# stall-watch.yml と同じ権限の job から、使い捨ての probe の PR (head が
# probe/2614-rearm のもの) にだけ auto-merge の掛け直しを打ち、stderr を出す。
# 比較のため contents: write を足した job も並べる。

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  current-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          pr=$(gh pr list --repo "$REPO" --head probe/2614-rearm --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || { echo "probe の PR が無い"; exit 1; }
          gh --version
          gh pr view "$pr" --repo "$REPO" --json number,headRefName,isDraft,mergeStateStatus,mergeable,autoMergeRequest
          echo "--- gh pr merge --auto --squash"
          gh pr merge "$pr" --repo "$REPO" --auto --squash
          echo "rc=$?"
          echo "--- 同じ呼び出しを GH_DEBUG=api で (呼ぶ mutation を見る)"
          GH_DEBUG=api gh pr merge "$pr" --repo "$REPO" --auto --squash 2>&1 | grep -viE 'authorization|^< (x-|set-cookie|strict|vary|access-control|content-security|referrer|server|date|etag|github-authentication)' | grep -E '^\* Request to|mutation|"errors"|"message"|"type"|^< HTTP|rc=|merge' | head -40
          echo "--- graphql enablePullRequestAutoMerge を直に"
          id=$(gh pr view "$pr" --repo "$REPO" --json id --jq .id)
          gh api graphql -f query='mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{autoMergeRequest{enabledAt}}}}' -f id="$id"
          echo "rc=$?"
          gh pr view "$pr" --repo "$REPO" --json autoMergeRequest
          gh pr merge "$pr" --repo "$REPO" --disable-auto
          echo "disable rc=$?"
          exit 0

  with-contents-write:
    needs: current-permissions
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          pr=$(gh pr list --repo "$REPO" --head probe/2614-rearm --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || { echo "probe の PR が無い"; exit 1; }
          gh pr view "$pr" --repo "$REPO" --json number,mergeStateStatus,autoMergeRequest
          echo "--- gh pr merge --auto --squash (contents: write)"
          gh pr merge "$pr" --repo "$REPO" --auto --squash
          echo "rc=$?"
          gh pr view "$pr" --repo "$REPO" --json autoMergeRequest
          echo "--- 外す"
          gh pr merge "$pr" --repo "$REPO" --disable-auto
          echo "disable rc=$?"
          gh pr view "$pr" --repo "$REPO" --json autoMergeRequest
          exit 0

name: Stall watch

# 止まった PR を見つけて、scripts/stall-watch.sh 冒頭の読み分け表の分類を名乗る (#961)。
#
# 表は PR が止まるたびに 1 行ずつ増えてきたが、読むのは人間とエージェントの目だけで、
# 気付く経路が「誰かがたまたま見る」しか無かった (#840 は 2 時間 47 分・#690 は 45 分
# 止まった)。
#
# **契機が schedule なのは、詰まりが「何も起きないこと」だからである。** pull_request や
# merge_group を契機に走る既存の検査 (pr-gate.yml の review-gate / drawing-evidence・
# render.yml) は PR に出来事が起きたときしか動かないので、この事象は原理的に
# 捕まえられない。時計を持つ機構が要る。
#
# ロジックを YAML に埋めないのは単体テストで固定できないため (#66 / triage.sh と同じ
# 理由)。判定は scripts/stall-watch.sh、検査は scripts/tests/stall_watch_test.py。
#
# **名乗るだけで、何も打たない** (#2734)。かつては対処の step (scripts/stall-act.sh) が古い
# 失敗ジョブを rerun していたが、必須は作成順で最新の check suite を読むので (scripts/ci-gate.sh
# 冒頭の「必須の判定が読む check run」・#2577)、古い suite の赤は必須を塞がず、打ち直しは
# macOS の枠を使うだけだった。打つ step と actions: write を外した。auto-merge の掛け直しも
# 当番の権限では通らないので外してある (#2614)。どちらも名乗りの行を読んだ人が打つ。
#
# **起票はしない。** publication.yml と同じ形で、赤くするところまでに留める
# (ADR-0008 決定 5 の段 1)。赤を見落とす事象が実際に起きたら、そのとき
# ruleset-drift.yml と同じ形で起票を足す。

on:
  schedule:
    # 15 分ごとに頼む。毎時 0 分はランナーが混むので外す (ruleset-drift.yml と同じ理由)。
    # **この間隔は保証されない。** schedule はベストエフォートで間引かれ、実測は導入から
    # 1 日 6〜8 回 (2〜5 時間おき) だった (#1197)。頼む間隔を広げても間引きは直らないので
    # 据え置く
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# run: を pipefail 付きの bash で走らせる (#2609)。理由と固定は scripts/tests/workflow_pipe_test.py
defaults:
  run:
    shell: bash

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      # PR と run を読むだけ。書き込みの権限は持たない — 打つ step を外した (#2734)
      pull-requests: read
      actions: read # 専用機の render の run と job・pr-gate の run と job を読む
    steps:
      - uses: actions/checkout@v7

      - name: 止まった PR を判定する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 終了コードは「人手が要る名乗りが猶予を超えて続いているか」(scripts/stall-watch.sh の冒頭)
          if ! bash scripts/stall-watch.sh; then
            echo "人手が要る詰まりが猶予を超えて続いている (分類と対処は上の行と、scripts/stall-watch.sh 冒頭の読み分け表)" >&2
            exit 1
          fi
          # 猶予の内の名乗りと、猶予に数えない unreadable は残りうる
          echo "ok: 猶予を超えた詰まりは無い (猶予の内の名乗りが出ていれば上の行)"

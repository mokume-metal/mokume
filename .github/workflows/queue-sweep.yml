name: Queue sweep

# merge queue が捨てたグループの merge_group run を cancel する (#1265)。あわせて、
# 今のグループがある間は、専用機でまだ拾われていない render-pr の run も cancel する
# (#2064)。render.yml の門番の判断は専用機へ積む前の 1 回だけで、queue が空いている間に
# 積まれた render-pr は、後からできた先頭の render と専用機を取り合う。グループができる
# 瞬間に走るここが、その render-pr を専用機の queue から退かせる。走っている 1 本と
# 定期の scheduled-* には触らない (判断と理由は scripts/queue-sweep.sh の冒頭・ADR-0019 決定 7)
#
# merge queue はグループを作り直したり PR を外したりしても、古いグループの run を
# cancel しない。捨てられた run は macOS の枠 (ci.yml の ci-check と test-release) を
# 使い続け、今のグループの検証を待たせる。2026-09-15 には 1 日に 2 回起き、どちらも
# merge が 30〜50 分止まった。
#
# **契機は「グループが変わる瞬間」に置く。** 作り直されたグループは新しい merge_group
# を立て、外れた PR は dequeued を立てる — 後ろにグループが居ない PR が外れたときは
# 前者が起きないので、両方を拾う。
#
# 手段は ADR-0008 決定 5 の順に比べた (#1265):
#
# - **当番 (stall-watch.yml) には足さない。** 実測で数時間おきにしか走らず (#1197)、
#   塞ぎたい停止より遅い
# - **native の concurrency では書けない。** 同じ PR の旧グループと新グループを同じキーに
#   するには PR 番号が要るが、式言語には split も正規表現も無く head_ref から抜き出せない。
#   キーをグループ共通にすると、並行して検証中の他のグループ (max_entries_to_build: 5) まで
#   cancel してしまう
# - **ci.yml には相乗りさせない。** pull_request の dequeued を足すと ci-check /
#   test-release まで起動し、すべてのジョブの条件に手を入れることになる
#
# **必須チェックには入れない。** 掃除が落ちても、今のグループの検証の可否は変わらない。
#
# 取り残しが出る形は 1 つあり、次の契機で拾われる方向にしか外れない: グループの ref の削除と
# 新しい ref の作成は 1〜2 秒の差で起きる。ジョブの起動より短いが、削除が遅れれば今回の掃除
# には映らない。
#
# **dequeued は pull_request_target で受ける (#1951)。** merge queue が PR を外したとき
# (checks の失敗・衝突・時間切れ) の dequeued は、起動者が github-merge-queue[bot] になる。
# この bot はコラボレータではないので、pull_request で受けると、fork 対策の「外部の人の
# ワークフローは毎回承認」(ADR-0019 決定 7) の関門で止まる。2026-09-22〜10-03 には 35 件
# すべてが承認待ちになり、#1265 が拾いたかった「後ろにグループが居ない PR が外れた」場合の
# 掃除が走らなかった。関門はジョブの if より前にあるので、条件では避けられない。
# pull_request_target はベース側の定義とコードで走るので関門の対象外になる。合流 ref も要らない
# ので、衝突で外れた PR でも起動する (かつては #694 の形で起動しないと書いていた)。
# **PR の中身は checkout しない** — checkout は既定でベースを取り、queue-sweep.sh も
# イベントの中身を読まない。pull_request_target で危ないのは PR の中身を権限付きで走らせる
# 形だけなので、それを踏まない
#
# 判断は scripts/queue-sweep.sh が持つ (検査は scripts/tests/queue_sweep_test.py)。
# ロジックを YAML へ埋めない理由は triage.yml と同じ (#66)。

# merge_group の既定の run 名はワークフロー名に落ち、どのグループの掃除か分からない
# (ci.yml の run-name と同じ理由)。値のクォートは必須 — `: ` と `#` が YAML の構文に当たる。
run-name: "${{ github.event_name == 'merge_group' && format('merge queue: {0}', github.event.merge_group.head_ref) || format('dequeued: #{0}', github.event.pull_request.number) }}"

on:
  merge_group:
  pull_request_target:
    types: [dequeued]

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # 捨てられたグループの run と、専用機で待つ render-pr の run の cancel
    steps:
      - uses: actions/checkout@v7
      - name: 捨てられたグループの run と、専用機で待つ render-pr の run を cancel する
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/queue-sweep.sh

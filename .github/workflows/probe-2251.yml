# #2251 の切り分け用 (使い捨て・merge しない)
name: probe-2251
on:
  pull_request:
    types: [opened, synchronize]
    paths: [.github/workflows/probe-2251.yml, Tests/MokumeCoreTests/HangProbeTests.swift]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: swift build --build-tests 2>&1 | tail -3
      - name: 1 通りずつ別プロセスで 5 回
        run: |
          mkdir -p probe
          cases="sphere-stroke sphere-stretched-stroke sphere-stretched-stroke-cpu ellipsoid-stroke ellipsoid-stroke-cpu ellipsoid-fill torus-stroke torus-fill sphere-stretched-fill-stroke"
          for round in 1 2 3 4 5; do
            for c in $cases; do
              MTL_DEBUG_LAYER=1 MTL_DEBUG_LAYER_WARNING_MODE=nslog MOKUME_HANG_PROBE=$c \
                swift test --skip-build --filter HangProbeTests > "probe/$c-$round.log" 2>&1 || true
              h=$(grep -c "ErrorHang" "probe/$c-$round.log" || true)
              v=$(grep -c "InnocentVictim" "probe/$c-$round.log" || true)
              p=$(grep -c "passed after" "probe/$c-$round.log" || true)
              echo "$round $c hang=$h victim=$v passed=$p" | tee -a probe/summary.txt
            done
          done
      - name: 既存の検査を単独で 5 回
        run: |
          for round in 1 2 3 4 5; do
            for f in "SolidGPUStrokeTests/matchesCPU" "SolidTests/solidCachesStayWithinTheBudget"; do
              n=$(echo "$f" | tr '/' '_')
              MTL_DEBUG_LAYER=1 MTL_DEBUG_LAYER_WARNING_MODE=nslog swift test --skip-build --filter "$f" > "probe/$n-$round.log" 2>&1 || true
              echo "$round $f hang=$(grep -c ErrorHang probe/$n-$round.log || true) failed=$(grep -c '✘' probe/$n-$round.log || true)" | tee -a probe/summary.txt
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: probe/
          retention-days: 3

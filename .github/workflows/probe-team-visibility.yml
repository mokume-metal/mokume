name: Probe team visibility

# **使い捨ての探り (#1232)。merge する前に消す。**
#
# 1 回目の探り (run 34939239789) で分かったこと:
#
#   GraphQL の timelineItems       requestedReviewer が null — Team のノードが見えない
#   REST の timeline               requested_team: maintainers は読める
#   POST team_reviewers[]          422 Could not resolve to a node with the global id …
#
# **GITHUB_TOKEN は Team 宛てにレビュー依頼を出せない。** そこで宛先を「落ちた承認の主
# (User)」へ替えられるかを確かめる。承認を落とすたびにメンテナの Approve を 1 回使うので、
# 探りは push だけで走る形にする (この PR には 06:51:30Z の dismissal が既に残っている)。
#
#   1. GraphQL の ReviewDismissedEvent から review.author.login が読めるか
#   2. GITHUB_TOKEN で User 宛てのレビュー依頼を出せるか (出せたら消す)

run-name: "#${{ github.event.pull_request.number }} 探り: 落ちた承認の主へ出せるか"

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 落ちた承認の主が読めるか
        id: dismissed
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016
          login=$(gh api graphql -f owner=mokume-metal -f name=mokume -F number="$NUM" \
            -f query='query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner,name:$name){pullRequest(number:$number){
                timelineItems(itemTypes:[REVIEW_DISMISSED_EVENT],last:10){
                  nodes{... on ReviewDismissedEvent{createdAt review{author{login} state}}}}}}}' \
            --jq '.data.repository.pullRequest.timelineItems.nodes[-1].review.author.login // ""')
          echo "読めた login: [$login]"
          echo "login=$login" >> "$GITHUB_OUTPUT"

      - name: User 宛ての依頼を出せるか (出せたら消す)
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.pull_request.number }}
          LOGIN: ${{ steps.dismissed.outputs.login }}
        run: |
          [ -n "$LOGIN" ] || { echo "login が読めなかったので試せない"; exit 0; }
          if gh api --method POST "repos/mokume-metal/mokume/pulls/$NUM/requested_reviewers" \
            -f "reviewers[]=$LOGIN" >/dev/null; then
            echo "出せた ($LOGIN) — 消しておく"
            gh api --method DELETE "repos/mokume-metal/mokume/pulls/$NUM/requested_reviewers" \
              -f "reviewers[]=$LOGIN" >/dev/null || true
          else
            echo "出せなかった (上の応答が理由)"
          fi

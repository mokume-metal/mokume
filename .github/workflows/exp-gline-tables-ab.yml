#
# 使い捨て: #3237 の差し替えた合格線 (同じ runner の上で、行表だけのデバッグ情報が
# テストのビルドを 20% 以上縮めるか) に届くかを、ホストの macOS runner で測る (束 #3372)。
# merge しない。結果を #3237 に載せたら PR ごと閉じる。
name: exp-gline-tables-ab
on:
  pull_request:
    types: [opened, synchronize]
    paths: [.github/workflows/exp-gline-tables-ab.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # merge queue とほかの PR の ci-check に macOS の枠を譲るため、1 本ずつ
      max-parallel: 1
      matrix:
        include:
          - round: 1
            order: "off on"
          - round: 2
            order: "off on"
          - round: 3
            order: "on off"
    steps:
      - uses: actions/checkout@v7
      - name: measure
        env:
          ORDER: ${{ matrix.order }}
          ROUND: ${{ matrix.round }}
        run: |
          set -u
          SG="-Xswiftc -emit-symbol-graph -Xswiftc -emit-symbol-graph-dir -Xswiftc $PWD/.build/symbol-graphs"
          R="$RUNNER_TEMP/result.txt"; : > "$R"
          note() { echo "$*" | tee -a "$R"; }
          note "round=$ROUND order=[$ORDER] cores=$(sysctl -n hw.ncpu) mem=$(( $(sysctl -n hw.memsize) / 1073741824 ))G $(swift --version 2>&1 | head -1)"
          t0=$SECONDS; swift package resolve > /dev/null 2>&1; note "resolve wall=$((SECONDS - t0))s"
          step() { # 条件 段 引数...
            local cond=$1 name=$2; shift 2
            local t0=$SECONDS
            swift build "$@" > "$RUNNER_TEMP/$cond-$name.log" 2>&1; local rc=$?
            note "$cond $name rc=$rc wall=$((SECONDS - t0))s compiling=$(grep -c ' Compiling ' "$RUNNER_TEMP/$cond-$name.log") $(grep -o 'Build complete! ([0-9.]*s' "$RUNNER_TEMP/$cond-$name.log" | tail -1)"
            [ "$rc" -eq 0 ] || tail -40 "$RUNNER_TEMP/$cond-$name.log"
          }
          for cond in $ORDER; do
            # 依存の checkout は残し、組んだものだけを消して clean に組む
            rm -rf .build/arm64-apple-macosx .build/debug .build/symbol-graphs
            if [ "$cond" = on ]; then F="-Xswiftc -gline-tables-only"; else F=""; fi
            step "$cond" build $SG $F
            step "$cond" tests --build-tests $SG $F
          done
          cat "$R" >> "$GITHUB_STEP_SUMMARY"

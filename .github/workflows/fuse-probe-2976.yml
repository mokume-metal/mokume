name: fuse-probe-2976

# **使い捨ての計測 (#2976・#2371 の直し 2)。マージしない。** 直し 1 (種別ごとの特化・#2977) の上で、
# 隣り合う画素ごとの組み込みの効果 (反転・単色化・周辺減光・色調整) を 1 パスにまとめる / まとめない
# を、同じバイナリで切り替えて 4K の GPU の壁時計を測る。手元の M3 Max では得が測れなかったので、
# 専用機 (mokume-m4・無印 M4) で測り直す。SSH では専用機に入れない (#1767) ので、専用機に届く経路
# (同一リポジトリの PR・ADR-0019 決定 7 段階 B) を使う。形は #1922 と、docs/agent-environment.md の
# 「使い捨ての Draft PR」の雛形 (#2303・門番 → 計測の job) に従う。

on:
  pull_request:
    types: [opened, synchronize, reopened]

# push し直したら古い実行を捨てる
concurrency:
  group: fuse-probe-2976-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  turn:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 65 # render-turn.sh の待ちの上限 (60 分) より外に置く
    permissions:
      contents: read # checkout
      actions: read # merge queue の render の run を読む
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/render-turn.sh wait

  probe:
    needs: turn
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/runner-preflight.sh
      - name: 機械の記録
        run: |
          mkdir -p .build/fuse-probe
          {
            sysctl -n machdep.cpu.brand_string
            sysctl hw.ncpu hw.memsize
            sw_vers
            swift --version 2>&1
            uptime
            pmset -g therm 2>&1
          } | tee .build/fuse-probe/machine.txt
      - name: release でビルド (検証レイヤは切る)
        run: swift build -c release -Xswiftc -enable-testing --build-tests
      - name: 計測 (まとめる / まとめない / 全種入りを交互に・単発を 2 回)
        env:
          MOKUME_FUSE_PROBE: "1"
        run: |
          for run in 1 2; do
            echo "::group::run-$run"
            PROBE_LABEL="run$run" python3 scripts/gpu-slot.py --exclusive -- \
              swift test -c release -Xswiftc -enable-testing --skip-build --filter EffectFuseProbe2976
            echo "::endgroup::"
          done
      - name: 結果を要約へ書く
        if: always()
        run: |
          {
            echo '### machine'
            echo '```'
            cat .build/fuse-probe/machine.txt
            echo '```'
            for f in .build/fuse-probe/probe-*.tsv; do
              echo "### $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuse-probe
          path: .build/fuse-probe/
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

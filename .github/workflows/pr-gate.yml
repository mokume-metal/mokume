name: PR gate

# PR の作法の検査 (タイトル・マージ判定・描画の絵) を、コードの検査 (ci.yml の ci-gate) と
# 別の必須チェック pr-gate にまとめる (#2611・#2668)。
#
# **分ける理由は、古い赤が必須チェックに残ること** (#259・#2134・#2577)。作法の検査が ci-gate の
# needs に居ると、本文やラベルを直して新しい run が緑になっても、直す前の run の赤い ci-gate が
# 同じ SHA に残る。直す前の run の ci-gate は macOS の ci-check (約 14 分) を待って終わるので、
# 直した後の run より遅く終わりやすい。pr-gate は API を読むだけの数十秒のジョブで、直した後の
# 出来事の run は作成順で新しい suite に載るので、必須はその結論を読む (下の permissions の後の注釈)。
#
# **段階的に切り替えた** (#2611 の条件 3)。pr-gate を足して ci-gate と重ねた (#2668) → メンテナが
# pr-gate を必須に適用した → ci.yml の ci-gate から作法の検査を外した (#2669)。必須の判定に空白を
# 作らないため。
#
# **別のワークフローに置くのは、起動のきっかけを分けるため。** 作法の検査には labeled /
# edited / pull_request_review が要るが、コードの検査には要らない。ci.yml はそれらで起きない
# (#2611 の条件 2)。

on:
  pull_request:
    # ready_for_review: merge できるようになる時点で判定し直す。Draft の間に Issue 側のラベル
    # (verify:) が変わっても PR の run は起きないので、ready の時点の状態で付け直す
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # 変更要求の投稿・却下で review-gate を付け直す
  pull_request_review:
    types: [submitted, dismissed]
  # **merge_group でも結論を返す。** 必須チェックは PR と merge queue で共通なので、ここで何も
  # 報告しないと queue が期限 (main-protection.json の check_response_timeout_minutes) まで待って
  # 弾く。merge_group には PR の文脈 (本文・ラベル) が無いので、ジョブは skipped で返す —
  # skipped は必須を満たす。判定は PR の側で済んでいる
  merge_group:

permissions:
  contents: read

# **concurrency を持たない** (#2716)。出来事ごとの run はどれも止めずに最後まで走る。
#
# 必須が読むのは、作成順で最新の check suite (run) の pr-gate である (規則は scripts/ci-gate.sh
# 冒頭の「必須の判定が読む check run」・#2577)。結論が付く順 (完了順) は問わないので、古い run の
# 結論が後から付いても、新しい run の結論は覆らない。どの run も走った時点で PR を API で読むので、
# 最新の suite の run は自分の出来事以降の状態 (ラベル・タイトル・本文の直し) で判定する。ci.yml も
# concurrency を持たずに同じ規則で動いている。
#
# group を持つと、効果は打ち切りだけになる。打ち切られた run が最新の suite なら、必須はその
# cancelled を読む (待ちと読む向きは未確認・#2692):
#
# - cancel-in-progress: true (以前): 走っている run を後から group に入った run が止める。**group に
#   入る順は作成順と逆になりうる** — #2712 では作成と同時のラベルで同じ秒に 2 本の run が立ち、
#   新しい run が先に group に入って、後から入った古い run に cancel された。必須は新しい suite の
#   cancelled を読み、必須が揃っても BLOCKED のまま queue に入らなかった
# - cancel-in-progress: false: 待っている 1 本を、次に来た run が置き換える (GitHub の文書の既定の
#   動き)。置き換えられた run はジョブを 1 本も作らずに cancelled で終わり、suite に pr-gate の
#   check run が残らない (#2730 の a0ad3c6 の run 38767942922 ほか)。PR gate の run は 1 秒以内に
#   5〜6 本立つことがある
# - queue: max (待ちを並べる): 固定している actionlint が受けない (rhysd/actionlint#657)
#
# 手で cancel した run が最新の suite に残る形は、scripts/stall-watch.sh が stale-gate と名乗る。

# run: を pipefail 付きの bash で走らせる (#2609)。理由と固定は scripts/tests/workflow_pipe_test.py
defaults:
  run:
    shell: bash

jobs:
  # 必須チェックの context はこのジョブの名前 (main-protection.json)。改名するときは同時に直す。
  #
  # **skipped にするのは merge_group だけで、Draft でも判定する。** Draft を skipped にすると
  # 赤は出なくなるが、ready にした直後の数秒 (ready_for_review の run の check が付くまで。
  # #2668 の probe で ready から 5 秒)、判定していない skipped が同じ SHA の最新として残る。
  # skipped は必須を満たすので、作法の検査が ci-gate から外れた後 (#2669) は
  # `gh pr ready` の直後の `gh pr merge --auto` が、一度も判定されていない PR を queue へ入れうる。
  # Draft の赤は merge を止めず、stall-watch も Draft を見ない。直せば新しい run の結論が
  # 最新になる (#2668 の probe)。
  #
  # **3 つの判定は 1 つのジョブの step に並べ、どの起動でも 3 つとも走らせる。** check が 1 つ
  # なので、レビューの run が review-gate だけを見て緑を返すと、赤いタイトルを隠す。3 つとも
  # 前の step (材料を取る pr-snapshot を含む) が赤でも走る (!cancelled())。continue-on-error は
  # 使わない — 赤が success に化ける。
  #
  # **判定は既定ブランチ (main) の版のスクリプトで走らせる** (#2001・ADR-0031 決定 2)。PR の版
  # で走らせると、同じ PR の中で自分を裁く検査を書き換えて通れてしまう。スクリプトは PR の
  # 中身 (タイトル・本文・ファイル一覧・ラベル・レビュー・Issue) をすべて API から読むので、
  # PR の木は要らない。ref を PR の base にしないのは、base は PR の側が選べるからである。
  # 判定を変える PR の効き目は merge の後の PR から始まる。ゲートが壊れていて、それを直す PR
  # も同じゲートで赤になるときの脱出口は、その PR の中で 2 か所を外すこと: この checkout の
  # with: と ref の 2 行 (ref だけを外すと空の with: を actionlint が赤にする) と、それを固定する
  # scripts/tests/pr_gate_workflow_test.py の test_判定は既定ブランチの版で走らせる の ref の
  # assertIn (外さないと必須の ci-gate で赤になる・#2724)。後続の PR で両方戻す (ADR-0031 決定 2)。
  #
  # **pull_request_target は使わない。** base の workflow で走るので PR が workflow を書き換えて
  # 自分を通す道は塞がるが、(1) この workflow が main に入るまで一度も走らず、足す PR で確かめ
  # られない (2) 既定で書き込みの token を持つ起動で、誤って PR の木を checkout すると秘密と
  # 書き込み権限の下で PR のコードを走らせる。workflow の書き換えは PR の diff に現れ、
  # ci.yml の現行と同じ境界である。
  #
  # **ペイロードの可変な欄 (title / body / labels) を読まない。** 3 つとも API から読み直すので、
  # rerun が古いイベントを再生しても古い値で判定しない (#699)。タイトルの照合の正規表現は
  # ここが唯一の置き場である (ci.yml の pr-title は #2669 で消えた)。固定は
  # scripts/tests/pr_gate_workflow_test.py
  pr-gate:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # 既定ブランチの scripts を checkout する
      issues: read # review-gate が閉じる Issue の型とラベルを読む
      pull-requests: read # タイトル・本文・ファイル・ラベル・レビューを読む
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # 3 つの判定が読む PR の材料 (メタデータ・変更ファイル) を、ここで 1 回だけ取る (#3261)。
      # 取らないと、同じ PR のメタデータを 3 回・変更ファイルを 2 回、数秒のうちに別々に取る。
      # 置き場は MOKUME_PR_SNAPSHOT_DIR で、以降の step へ渡す。読み手は scripts/pr-files.sh
      # (置き場が未設定・欠けているときは従来どおり自分で取る)。**この step が落ちれば job は赤で、
      # 後ろの 3 つも !cancelled() で走る — 環境変数が立たないので自前取得になり、緩みもしない**
      # (continue-on-error は使わない)。判定は既定ブランチの scripts で走るので、このファイルを
      # 変える PR 自身の run では読み手が古く、事前取得は使われない (効くのは merge 後の PR から)
      - name: pr-snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          . scripts/pr-files.sh
          dir="$RUNNER_TEMP/pr-snapshot"
          mkdir -p "$dir"
          # 一時の名前へ書いてから mv で置く — 途中で落ちた回に、半端なファイルを正規の名前で残さない。
          # 読み手は変更ファイルと PR のメタデータが揃っているときだけ事前取得を読む(files を先に、
          # view を後に置く)。欄は 3 つの読み手 (title の step・review-gate・drawing-evidence) の和集合
          gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
            --json title,body,labels,number,latestReviews,closingIssuesReferences,baseRefName,headRefOid,createdAt \
            >"$dir/view-$PR_NUMBER.json.part"
          pr_files "$GITHUB_REPOSITORY" "$PR_NUMBER" >"$dir/files-$PR_NUMBER.txt.part"
          mv "$dir/files-$PR_NUMBER.txt.part" "$dir/files-$PR_NUMBER.txt"
          mv "$dir/view-$PR_NUMBER.json.part" "$dir/view-$PR_NUMBER.json"
          echo "MOKUME_PR_SNAPSHOT_DIR=$dir" >>"$GITHUB_ENV"

      # PR タイトル = squash 後のコミットメッセージなので Conventional Commits を検査する。
      # **タイトルは API から読む** — ペイロードの title は rerun で古いタイトルを再生する (#699)。
      # 上の pr-snapshot が取った JSON があればその .title を、無ければ REST で自分で取る。
      # step の名前は scripts/stall-watch.sh の bad-title が読む (TITLE_STEP)。改名するときは同時に直す
      - name: pr-title (Conventional Commits)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 事前取得は、番号がこの PR のものと一致するときだけ読む
          if [ -z "${MOKUME_PR_SNAPSHOT_DIR:-}" ] ||
            ! title=$(jq -er --argjson n "$PR_NUMBER" 'select(.number == $n) | .title' \
              "$MOKUME_PR_SNAPSHOT_DIR/view-$PR_NUMBER.json"); then
            title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          fi
          if grep -qE '^(feat|fix|docs|refactor|test|chore|ci|perf|build)(\([^)]+\))?!?: .+' <<<"$title"; then
            echo "ok: $title"
          else
            echo "PR タイトルが Conventional Commits ではない: $title" >&2
            echo '形式: <type>(<scope>): <要約>  (type: feat/fix/docs/refactor/test/chore/ci/perf/build)' >&2
            echo 'design は Issue Type であって type ではない。' >&2
            echo 'タイトルを直すと新しい run が走り、pr-gate はその run で付け直される (打ち直しも新しいコミットも要らない)。' >&2
            exit 1
          fi

      # ADR-0002 / ADR-0031 のマージ判定 (実体は scripts/review-gate.sh)
      - name: review-gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/review-gate.sh "$PR_NUMBER"

      # 描画に触れる PR に絵が載っていること (#306。実体は scripts/check-drawing-evidence.sh)
      - name: drawing-evidence
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-drawing-evidence.sh

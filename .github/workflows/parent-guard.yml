name: Parent guard

# open の sub-issue を残したまま親 Issue を completed で close したら、reopen して
# 警告する (ツリーの不変条件: 親の close = 全作業完了。ADR-0002 / #23)。
# not_planned での close は対象外 — ツリーごと畳む意図を妨げない。

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  guard:
    if: github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - name: open の sub-issue が残っていないか
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          open_children=$(gh api "repos/$REPO/issues/$NUM/sub_issues" \
            --jq '[.[] | select(.state == "open")] | map("- #\(.number) \(.title)") | join("\n")' 2>/dev/null || true)
          if [ -n "$open_children" ]; then
            gh issue reopen "$NUM" -R "$REPO"
            body="open の sub-issue が残っているため reopen した (親の close = 全作業完了がツリーの不変条件):"
            body="$body"$'\n\n'"$open_children"$'\n\n'"ツリーごと畳む意図なら、先に子を閉じるか、親を **not planned** で close する。"
            gh issue comment "$NUM" -R "$REPO" --body "$body"
          else
            echo "ok: open の sub-issue なし"
          fi

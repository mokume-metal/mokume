name: Parent guard

# open の sub-issue を残したまま親 Issue を completed で close したら、reopen して
# 警告する (ツリーの不変条件: 親の close = 全作業完了。ADR-0002 / #23)。
# not_planned での close は対象外 — ツリーごと畳む意図を妨げない。
#
# 判断は scripts/parent-guard.sh が持つ (検査は scripts/tests/parent_guard_test.py)。
# issues イベントの workflow は既定ブランチのものしか走らないため、ロジックをここへ
# 埋めると main に入れるまで誰も確かめられない (#66 で確認した性質)。**その性質を
# 最初に踏んだのがこの判定である** — #23 で空振りし、それが scripts/check-workflows.sh
# を生んだ。規律を作ったきっかけのファイルだけが規律の外に残っていた (#798)。

# run-name が無いと GitHub は run 名にイベント既定 (issues → Issue タイトル) を使う
# ため、同じタイトルの Issue が複数あるとどの Issue の run か Actions 一覧から辿れ
# ない (#67)。番号を前置して一意にする。
#
# 値のクォートは必須。`#` は YAML のコメント開始文字なので、クォート無しでは値が
# 空になる。`${{ }}` は YAML パース後に評価されるので、Issue タイトル側に `"` や
# `: ` が入っていても壊れない。
#
# このワークフローは on: issues のみを受けるので、#38 の ci.yml のようなイベント
# ごとの条件分岐は要らない。
run-name: "#${{ github.event.issue.number }} ${{ github.event.issue.title }}"

on:
  issues:
    types: [closed]

permissions:
  issues: write
  contents: read

jobs:
  guard:
    # not planned はここで落とす。イベントの payload にしか無い値による切り分けで、
    # 判定ではない (triage.yml の types: [opened] と同じ層) — スクリプトへ移すと、
    # ツリーごと畳む close のたびに runner が立つ
    if: github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: open の sub-issue が残っていないか
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: bash scripts/parent-guard.sh "$NUM"

name: CI

# merge queue の run だけタイトルがワークフロー名「CI」のままで、どの PR の実行か
# 分からなかった (#38)。run-name が無いと GitHub はイベント固有の情報を run 名に
# するが (push → コミット 1 行目 / pull_request → PR タイトル / issues → Issue
# タイトル)、merge_group にはその既定が無くワークフロー名へ落ちるため。
#
# 他イベントでは空文字を返し、既定の表示に委ねる (空文字なら既定に戻ることは #66
# で実測)。PR 番号だけを抜き出したいところだが、Actions の式言語には split も正規
# 表現も無いので ref を丸ごと出す。squash 予定のコミットメッセージ
# (merge_group.head_commit.message) の方が読みやすいが、改行込みで丸ごと入って
# しまうため使えない (#66)。
#
# 値のクォートは必須。`merge queue: ` の `: ` があるとクォート無しでは YAML として
# 不正になり、workflow file issue で run が空振りする (#66)。
run-name: "${{ github.event_name == 'merge_group' && format('merge queue: {0}', github.event.merge_group.head_ref) || '' }}"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # Approve / 却下でも review-gate を自動再評価する
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 検査の実体は make ci-check に集約する。CI にステップを足したくなったら
  # まず Makefile に足し、このジョブは呼ぶだけを保つ。
  #
  # macOS ランナーで走らせる。ci-check に swift build / swift test が入り、
  # ADR-0009 が macOS 26 / Metal 4 を前提に置いているため Linux ではビルドできない
  # (このリポジトリは public なので Actions の従量課金はかからない)。
  ci-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # chardet も入れる: reuse の encoding 判定モジュールを固定するため (#48)。
      # 既定では環境にあるものが選ばれ、ローカルと CI で判定が食い違う
      - name: Install tools
        run: |
          pipx install reuse && pipx inject reuse chardet
          pipx install check-jsonschema
      - run: make ci-check

  # PR タイトル = squash 後のコミットメッセージなので Conventional Commits を検査する。
  # merge_group にはタイトルが無いためスキップし、ci-gate 側は skipped を許容する。
  pr-title:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|test|chore|ci|perf|build)(\([^)]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "PR タイトルが Conventional Commits ではない: $TITLE" >&2
            echo '形式: <type>(<scope>): <要約>  (type: feat/fix/docs/refactor/test/chore/ci/perf/build)' >&2
            exit 1
          fi

  # ADR-0002 のマージ承認ルーティング (実体は scripts/review-gate.sh)。
  # 承認ラベルの付け外し (labeled/unlabeled) で自動的に再評価される。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  #
  # 終了コード 20 は「承認待ち」で、**故障ではないのでジョブは緑のまま**にする
  # (#111 / #256)。承認の状態は approval-signal ジョブが human-approval check run
  # として別に報告する。1 (差し戻し) はそのままジョブを赤くする。
  review-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pending: ${{ steps.gate.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
      - name: ADR-0002 ルーティング判定
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/review-gate.sh "${{ github.event.pull_request.number }}"
          code=$?
          set -e
          case "$code" in
            0)  echo "pending=false" >> "$GITHUB_OUTPUT" ;;
            20) echo "pending=true"  >> "$GITHUB_OUTPUT" ;;
            *)  exit "$code" ;;
          esac

  # 承認の状態を human-approval として報告する (#111 / #256 / #259 / #282)。
  #
  # なぜ Actions のジョブそのものでは足りないか — ジョブの結論は終了コード由来
  # (success / failure / cancelled / skipped) に限られ、「人の操作待ち」を表せない。
  # 必須チェックの通過扱いは success / skipped / neutral なので、待ちを neutral や
  # skipped で表すとゲートごと消える。
  #
  # ## check run ではなく commit status で報告する
  #
  # check run で表そうとすると、**作り足しても上書きしても詰む**ことが分かった (#282)。
  #
  # - 作り足す: 同じ SHA に同名の check run が 2 つ並び、古いほうが判定を固定する (#259)
  # - 上書きする: check run は**最初に作った run の check suite に居続ける**。承認は
  #   必ず後の run で届くので、最新の suite にはこの名前が現れない。マージボックスは
  #   `Expected — Waiting for status to be reported` のまま止まり、**何度承認しても
  #   解けない** (#279 で実測。API 側は success と言うのに画面は待ち続ける)
  #
  # commit status には suite が無く、**同じ context の最新が常に勝つ**。だから上書きが
  # そのまま「最新の判定」になり、食い違いが起きない。`action_required` は使えないが、
  # 待ちは `pending` で表せる — これは失敗ではないので #263 の要求 (承認待ちを故障として
  # 数えない) はそのまま満たせる。むしろ「保留中」という言葉のほうが実態に合う。
  #
  # merge_group では PR 文脈が無いので無条件に success を報告する。承認は PR 段階で
  # 必須チェックとして既に効いており、queue へ入れた時点で満たされている
  # (pr-title / review-gate を skip して ci-gate が許容しているのと同じ理屈)。
  # **必須チェックは merge queue でも報告が要る** — 報告が無いと queue が待ち続ける。
  #
  # ## 承認待ちを人にも届ける (#498)
  #
  # 上の報告の宛先はマージボックスであって、**人ではない**。承認が要る経路は 2 本あり
  # (パス由来 = ルールセットの required_reviewers / ラベル由来 = 対象 Issue の
  # verify: human)、**レビュー要求を作るのはパス由来だけ**だった。ラベル由来の
  # PR は Reviewers 欄が空のまま human-approval だけが pending で止まり、メンテナは PR を
  # 開くまで気付けない (#494 / #495 が実際に滞留した)。
  #
  # 宛先を足す場所はここでよい。同じ pending を読んで「待っている」と表明する係が既に
  # このジョブで、増えるのは宛先が 1 つだけである (新しいジョブは作らない —
  # ADR-0008 決定 5 の段 1「既存の機構の責務を広げる」)。
  #
  # **要求を飛ばすことと、ブロックすることは別である。** 要求の成否は human-approval にも
  # ci-gate にも影響せず、scripts/request-review.sh は失敗しても終了コード 0 を返す。
  # 通知が届かないことを、マージできないことに化けさせない。
  approval-signal:
    if: always() && github.event_name != 'push'
    needs: [review-gate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: human-approval を報告
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          PENDING: ${{ needs.review-gate.outputs.pending }}
        run: |
          if [ "$PENDING" = "true" ]; then
            state=pending
            description="メンテナの承認待ち (故障ではありません)"
          else
            state=success
            description="承認は要らない、または承認済み"
          fi
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context=human-approval \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" --silent
          echo "報告: human-approval → $state"

      # checkout はここまで要らない (status は API だけで打てる)。要求を投げるときだけ
      # 要る — スクリプトを走らせるため
      - uses: actions/checkout@v7
        if: needs.review-gate.outputs.pending == 'true' && github.event_name == 'pull_request'
      - name: 承認待ちをメンテナへ要求する
        if: needs.review-gate.outputs.pending == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/request-review.sh "${{ github.event.pull_request.number }}"

  # 描画を要する検査は、この世代のコマンド構造を持たない GPU の上では 1 本も走らない
  # (#180・ADR-0019 決定 7)。走ったことは **手元の make ci-check** が local-render
  # として報告する (#304)。このジョブが打つのは「手元の報告が要らない」場合だけで、
  # 描画に触れている PR には**何も打たない** — 打たないことがそのまま待ちになる。
  #
  # merge queue では、手元の報告が**合流後の姿を覆っているか**を判定する (#435)。
  # 覆っていなければ local-render を failure で打ち、queue から外す。GPU は要らない
  # — 木の中身 (path と blob の並び) を突き合わせるだけである。
  render-signal:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: local-render を代理で報告する
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          # gh-readonly-queue/<base>/pr-<番号>-<base sha>。積まれた PR を読む口 (#435)
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/render-status.sh proxy

  # 描画に触れる PR に**絵が載っていること**を要求する (#306)。
  #
  # CI は絵を描けない (#180・ADR-0019 決定 7) ので、新しい絵が正しいかの担い手は
  # 人間と AI の目である (ADR-0019 決定 1)。目に見せるものが無ければ担い手は働けず、
  # squash merge でブランチが消えた後には絵を足せない。それまで担保していたのは
  # PR テンプレートのコメント 1 行だけで、抜けたときに気付く経路が無かった。
  #
  # **GPU は要らない** — 変更ファイルの一覧と本文の文字列しか見ないので、上の
  # render-signal (手元の実行を待つ) とは独立に置ける。
  #
  # **ci-check ジョブには相乗りさせない。** あのジョブへ GH_TOKEN を持ち込むと、
  # render-status.sh が「CI からここへ来ても認証が無いのでここで止まる」と宣言して
  # いる前提 (#304) を崩し、CI が local-render を打てる状態になる。
  #
  # 本文を編集しても逃がしラベルを付け外ししても自動で再評価される
  # (on.pull_request.types に edited / labeled / unlabeled が入っている)。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  drawing-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: 描画に触れる PR に絵があるか
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-drawing-evidence.sh

  # ブランチ保護が要求する必須チェックのうち、**CI の健全性**を表す 1 つ。
  # ジョブが増えても required checks の登録名はこの 1 つを保つ。
  #
  # もう 1 つの必須チェック human-approval は approval-signal ジョブが報告する。
  # 名前を分けているのは種類が違うからで、ジョブが増えたからではない — ci-gate は
  # 「検査が壊れていないか」、human-approval は「人の操作を待っているか」を表す。
  # 混ぜると監視が承認待ちを故障と誤検出する (#111)。**承認待ちで ci-gate を赤く
  # しない**ため、needs に approval-signal は入れない。
  ci-gate:
    if: always()
    needs: [ci-check, pr-title, review-gate, drawing-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "必須ジョブが落ちている" >&2
            exit 1
          fi

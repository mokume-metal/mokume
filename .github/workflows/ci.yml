name: CI

# merge queue の run だけタイトルがワークフロー名「CI」のままで、どの PR の実行か
# 分からなかった (#38)。run-name が無いと GitHub はイベント固有の情報を run 名に
# するが (push → コミット 1 行目 / pull_request → PR タイトル / issues → Issue
# タイトル)、merge_group にはその既定が無くワークフロー名へ落ちるため。
#
# 他イベントでは空文字を返し、既定の表示に委ねる (空文字なら既定に戻ることは #66
# で実測)。PR 番号だけを抜き出したいところだが、Actions の式言語には split も正規
# 表現も無いので ref を丸ごと出す。squash 予定のコミットメッセージ
# (merge_group.head_commit.message) の方が読みやすいが、改行込みで丸ごと入って
# しまうため使えない (#66)。
#
# 値のクォートは必須。`merge queue: ` の `: ` があるとクォート無しでは YAML として
# 不正になり、workflow file issue で run が空振りする (#66)。
run-name: "${{ github.event_name == 'merge_group' && format('merge queue: {0}', github.event.merge_group.head_ref) || '' }}"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # Approve / 却下でも review-gate を自動再評価する
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 検査の実体は make ci-check に集約する。CI にステップを足したくなったら
  # まず Makefile に足し、このジョブは呼ぶだけを保つ。
  #
  # macOS ランナーで走らせる。ci-check に swift build / swift test が入り、
  # ADR-0009 が macOS 26 / Metal 4 を前提に置いているため Linux ではビルドできない
  # (このリポジトリは public なので Actions の従量課金はかからない)。
  #
  # **承認では走らせない** (#623)。承認は PR の中身を 1 バイトも変えないので、macOS で
  # swift build / swift test を回し直す理由が無い。pull_request_review トリガーの目的は
  # review-gate の再評価だけである (on: のコメント)。
  #
  # **ラベルの付け外しでも走らせない** (#729)。labeled / unlabeled も PR の木を 1 バイトも
  # 変えないので、#623 と同じ理由でここには居ない。types に残しているのは review-gate /
  # drawing-evidence / pr-title の再評価に要るためである (on: のコメント)。規約どおり
  # gh pr create --label でラベルを付けると opened と labeled が同じ秒に立ち、macOS の
  # フルビルドが 2 本走っていた (保持期間ぶんの実測で余剰 198 本・19.6 時間)。
  #
  # **edited は外さない。** 本文・タイトルのほかに base ブランチの変更でも発火し、この
  # ジョブの actions/checkout は ref を指定していないので pull_request では合流 ref
  # (refs/pull/N/merge) を取る — base が変われば検査する木そのものが変わる。
  #
  # 括弧を 1 段深くして pull_request の中に閉じ込めるのは、**push に action の欄が無い**
  # ためである。素直に並べると push では null と文字列を突き合わせることになり、可否が
  # 式言語の型強制の解釈に乗る。外れたときの姿が「main への push で ci-check が黙って
  # 走らない」なので、可否を決める比較は常に文字列同士にしておく — push と merge_group
  # では github.event_name != 'pull_request' が真になって短絡する。
  ci-check:
    if: >-
      github.event_name != 'pull_request_review'
      && (github.event_name != 'pull_request'
      || (github.event.action != 'labeled'
      && github.event.action != 'unlabeled'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # chardet も入れる: reuse の encoding 判定モジュールを固定するため (#48)。
      # 既定では環境にあるものが選ばれ、ローカルと CI で判定が食い違う
      - name: Install tools
        run: |
          pipx install reuse && pipx inject reuse chardet
          pipx install check-jsonschema
      - run: make ci-check

  # release のテストビルドと実行を、人が打たなくても走らせる (#1096)。
  #
  # **ci-check には足さない。** #761 完了条件 2 と AGENTS.md「性能は release で測る。入口は
  # make test-release の 1 つ」が決めた形は動かさず、ci-check の外に別の入口を置く。別ジョブ
  # なので ci-check と並列に走り、make ci-check を打ったときの所要時間は 1 秒も変わらない。
  #
  # 塞ぐのは release 側で起きて**誰にも見えない 2 つの赤**である (実害 3 件は #761 / #1021 /
  # #1086。3 件目では誰も見ていない赤が 9 日間 main に残った):
  #
  #   入口が組めなくなる赤 … 明示の隔離を持たない isolated deinit が Sources/ に入ると
  #                          release のテストビルドがコンパイルできない。debug でも
  #                          swift build -c release でも通るので、足した本人には壊れて見えない
  #   release でしか走らない検査の赤 … .enabled(if: !isDebugBuild) を持つ検査の失敗
  #
  # **1 つ目は #1083 の段 1 (make isolated-deinit) と重なるが、どちらも要る。** あちらは字句で
  # 「isolated deinit が隔離を明示した型の中にあるか」を見るので、**誰からも参照されない型でも**
  # 捕まえる。こちらはコンパイラ自身に言わせるので綴り以外の形で壊れるものも捕まえるが、
  # **誰からも参照されない internal 型では落ちない** (#1096 で実測)。落ちるのは取り込み側が
  # module を deserialize するときに既定隔離を見失う場合だけで、取り込む側が要るためである。
  #
  # **GPU を要する検査はここでも走らない。** CI の GPU はこの世代のコマンド構造を持たないので、
  # RenderDevice.isAvailable を条件に持つ Suite は debug と同じくスキップされる (ADR-0019
  # 決定 7)。2 つ目で届くのは GPU を要さない release 専用の検査だけで、#1086 の赤そのもの
  # (ShapeTests の速さ = GPU が要る) はここでは捕まらない。手元で make test-release を打つ
  # 理由はそのぶん残る。
  #
  # 承認とラベルの付け外しでは走らせない (#623 / #729) — どちらも PR の木を 1 バイトも
  # 変えないので、macOS で release ビルドを回し直す理由が無い。条件は ci-check と同じ形で、
  # 括弧を 1 段深くして pull_request の中に閉じ込める理由もそちらのコメントが持つ。
  #
  # 検査の実体は Makefile に集約する (このファイル冒頭の既定)。ここは呼ぶだけを保つ。
  test-release:
    if: >-
      github.event_name != 'pull_request_review'
      && (github.event_name != 'pull_request'
      || (github.event.action != 'labeled'
      && github.event.action != 'unlabeled'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-release

  # PR タイトル = squash 後のコミットメッセージなので Conventional Commits を検査する。
  # merge_group にはタイトルが無いためスキップし、ci-gate 側は skipped を許容する。
  #
  # 承認でも走らせない (#623)。タイトルは承認では変わらず、編集は pull_request の
  # edited が拾う。
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|test|chore|ci|perf|build)(\([^)]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "PR タイトルが Conventional Commits ではない: $TITLE" >&2
            echo '形式: <type>(<scope>): <要約>  (type: feat/fix/docs/refactor/test/chore/ci/perf/build)' >&2
            exit 1
          fi

  # ADR-0002 / ADR-0031 のマージ判定 (実体は scripts/review-gate.sh)。
  # 本文の編集・ラベルの付け外し・レビューの投稿で自動的に再評価される。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  #
  # **終了コードは 0 か 1 だけである。** かつては承認待ちを 20 で表し、approval-signal
  # ジョブが human-approval の commit status へ回していたが (#111 / #256 / #282)、
  # ラベル由来の承認そのものを ADR-0031 が畳んだので、待つ状態が無くなった (#618)。
  # 承認を要求するのはルールセットの required_reviewers だけで、それは GitHub 自身が
  # 判定する — ここで報告するものは無い。
  review-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: マージ判定
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/review-gate.sh "${{ github.event.pull_request.number }}"

  # 描画を要する検査は、この世代のコマンド構造を持たない GPU の上では 1 本も走らない
  # (#180・ADR-0019 決定 7)。走ったことは **手元の make ci-check** が local-render
  # として報告する (#304)。このジョブが打つのは「手元の報告が要らない」場合だけで、
  # 描画に触れている PR には**何も打たない** — 打たないことがそのまま待ちになる。
  #
  # merge queue では、手元の報告が**合流後の姿を覆っているか**を判定する (#435)。
  # 覆っていなければ local-render を failure で打ち、queue から外す。GPU は要らない
  # — 木の中身 (path と blob の並び) を突き合わせるだけである。
  render-signal:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: local-render を代理で報告する
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          # gh-readonly-queue/<base>/pr-<番号>-<base sha>。積まれた PR を読む口 (#435)
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/render-status.sh proxy

  # 描画に触れる PR に**絵が載っていること**を要求する (#306)。
  #
  # CI は絵を描けない (#180・ADR-0019 決定 7) ので、新しい絵が正しいかの担い手は
  # 人間と AI の目である (ADR-0019 決定 1)。目に見せるものが無ければ担い手は働けず、
  # squash merge でブランチが消えた後には絵を足せない。それまで担保していたのは
  # PR テンプレートのコメント 1 行だけで、抜けたときに気付く経路が無かった。
  #
  # **GPU は要らない** — 変更ファイルの一覧と本文の文字列しか見ないので、上の
  # render-signal (手元の実行を待つ) とは独立に置ける。
  #
  # **ci-check ジョブには相乗りさせない。** あのジョブへ GH_TOKEN を持ち込むと、
  # render-status.sh が「CI からここへ来ても認証が無いのでここで止まる」と宣言して
  # いる前提 (#304) を崩し、CI が local-render を打てる状態になる。
  #
  # 本文を編集しても逃がしラベルを付け外ししても自動で再評価される
  # (on.pull_request.types に edited / labeled / unlabeled が入っている)。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  drawing-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: 描画に触れる PR に絵があるか
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-drawing-evidence.sh

  # ブランチ保護が要求する必須チェックのうち、**CI の健全性**を表す 1 つ。
  # ジョブが増えても required checks の登録名はこの 1 つを保つ。
  #
  # かつてはもう 1 つ human-approval があり、「人の操作を待っているか」を別の名前で
  # 表していた (混ぜると監視が承認待ちを故障と誤検出する — #111)。ADR-0031 が
  # ラベル由来の承認を畳んで待つ状態そのものが無くなったので、必須チェックは
  # ci-gate と local-render の 2 本になった (#618)。
  ci-gate:
    if: always()
    needs: [ci-check, test-release, pr-title, review-gate, drawing-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "必須ジョブが落ちている" >&2
            exit 1
          fi

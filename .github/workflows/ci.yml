name: CI

# merge queue の run だけタイトルがワークフロー名「CI」のままで、どの PR の実行か
# 分からなかった (#38)。run-name が無いと GitHub はイベント固有の情報を run 名に
# するが (push → コミット 1 行目 / pull_request → PR タイトル / issues → Issue
# タイトル)、merge_group にはその既定が無くワークフロー名へ落ちるため。
#
# 他イベントでは空文字を返し、既定の表示に委ねる (空文字なら既定に戻ることは #66
# で実測)。PR 番号だけを抜き出したいところだが、Actions の式言語には split も正規
# 表現も無いので ref を丸ごと出す。squash 予定のコミットメッセージ
# (merge_group.head_commit.message) の方が読みやすいが、改行込みで丸ごと入って
# しまうため使えない (#66)。
#
# 値のクォートは必須。`merge queue: ` の `: ` があるとクォート無しでは YAML として
# 不正になり、workflow file issue で run が空振りする (#66)。
run-name: "${{ github.event_name == 'merge_group' && format('merge queue: {0}', github.event.merge_group.head_ref) || '' }}"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # Approve / 却下でも review-gate を自動再評価する
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 検査の実体は make ci-check に集約する。CI にステップを足したくなったら
  # まず Makefile に足し、このジョブは呼ぶだけを保つ。
  #
  # macOS ランナーで走らせる。ci-check に swift build / swift test が入り、
  # ADR-0009 が macOS 26 / Metal 4 を前提に置いているため Linux ではビルドできない
  # (このリポジトリは public なので Actions の従量課金はかからない)。
  ci-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # chardet も入れる: reuse の encoding 判定モジュールを固定するため (#48)。
      # 既定では環境にあるものが選ばれ、ローカルと CI で判定が食い違う
      - name: Install tools
        run: |
          pipx install reuse && pipx inject reuse chardet
          pipx install check-jsonschema
      - run: make ci-check

  # PR タイトル = squash 後のコミットメッセージなので Conventional Commits を検査する。
  # merge_group にはタイトルが無いためスキップし、ci-gate 側は skipped を許容する。
  pr-title:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|test|chore|ci|perf|build)(\([^)]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "PR タイトルが Conventional Commits ではない: $TITLE" >&2
            echo '形式: <type>(<scope>): <要約>  (type: feat/fix/docs/refactor/test/chore/ci/perf/build)' >&2
            exit 1
          fi

  # ADR-0002 のマージ承認ルーティング (実体は scripts/review-gate.sh)。
  # 承認ラベルの付け外し (labeled/unlabeled) で自動的に再評価される。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  review-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: ADR-0002 ルーティング判定
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/review-gate.sh "${{ github.event.pull_request.number }}"

  # ブランチ保護が要求する唯一の必須チェック。ジョブが増えても required checks の
  # 登録名はこの 1 つを保つ。
  ci-gate:
    if: always()
    needs: [ci-check, pr-title, review-gate]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "必須ジョブが落ちている" >&2
            exit 1
          fi

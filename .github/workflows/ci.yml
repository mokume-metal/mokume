name: CI

# merge queue の run だけタイトルがワークフロー名「CI」のままで、どの PR の実行か
# 分からなかった (#38)。run-name が無いと GitHub はイベント固有の情報を run 名に
# するが (push → コミット 1 行目 / pull_request → PR タイトル / issues → Issue
# タイトル)、merge_group にはその既定が無くワークフロー名へ落ちるため。
#
# 他イベントでは空文字を返し、既定の表示に委ねる (空文字なら既定に戻ることは #66
# で実測)。PR 番号だけを抜き出したいところだが、Actions の式言語には split も正規
# 表現も無いので ref を丸ごと出す。squash 予定のコミットメッセージ
# (merge_group.head_commit.message) の方が読みやすいが、改行込みで丸ごと入って
# しまうため使えない (#66)。
#
# 値のクォートは必須。`merge queue: ` の `: ` があるとクォート無しでは YAML として
# 不正になり、workflow file issue で run が空振りする (#66)。
run-name: "${{ github.event_name == 'merge_group' && format('merge queue: {0}', github.event.merge_group.head_ref) || '' }}"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # レビューの投稿・却下でも review-gate の run を新しく起こす (変更要求が残っていないかを
  # 見るため)。**起こした run が緑でも、先の run の赤い ci-gate は消えない** (ci-gate の上のコメント)
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
  # **main への push では走らせない** (#1713)。main へ入る経路は merge queue だけで
  # (main-protection.json の merge_queue 規則・bypass なし)、queue は合流後の木を必須の
  # ci-gate で検査済みである。push の run は、その merge_group と同じ head SHA を
  # 検査し直していた (2026-09-20〜27 の 157 件すべて・週 314 ジョブ分)。#1096 の
  # 「誰も見ていない release の赤」は、版を出す前の release.yml の release-check が塞ぐ
  # (#2662。merge の前ではなくなった — 理由は release.yml の release-check)。
  # push の run の結果を読むもの (release・stall-watch・queue-sweep・バッジ) も無い。
  # キャッシュ (#1715) の置き場に main の run が要ると分かったら、そのときに戻す。

permissions:
  contents: read

# run: を pipefail 付きの bash で走らせる (#2609)。理由と固定は scripts/tests/workflow_pipe_test.py
defaults:
  run:
    shell: bash

jobs:
  # 検査の実体は make ci-check に集約する。CI にステップを足したくなったら
  # まず Makefile に足し、このジョブは呼ぶだけを保つ。
  #
  # **段は 2 つのジョブで分け持つ** (#2612)。どちらも make ci-check を呼び、CI_CHECK_HOST で
  # 自分の段を選ぶ — このジョブ (macos) は macOS かビルドの成果物が要る段を、下の ci-static
  # (ubuntu) は木だけを読む段を走らせる。どの段がどちらに居るか (と、その理由) の正本は Makefile の
  # CI_STATIC_STEPS で、2 つを合わせると手元の make ci-check の全段にちょうど一致することは
  # scripts/tests/ci_workflow_test.py が見る。
  #
  # macOS ランナーで走らせる。このジョブの段に swift build / swift test が入り、
  # ADR-0009 が macOS 26 / Metal 4 を前提に置いているため Linux ではビルドできない
  # (このリポジトリは public なので Actions の従量課金はかからない)。
  #
  # **承認では走らせない** (#623)。承認は PR の中身を 1 バイトも変えないので、macOS で
  # swift build / swift test を回し直す理由が無い。pull_request_review トリガーの目的は
  # review-gate の再評価だけである (on: のコメント)。
  #
  # **ラベルの付け外しでも走らせない** (#729)。labeled / unlabeled も PR の木を 1 バイトも
  # 変えないので、#623 と同じ理由でここには居ない。types に残しているのは review-gate /
  # drawing-evidence / pr-title の再評価に要るためである (on: のコメント)。規約どおり
  # gh pr create --label でラベルを付けると opened と labeled が同じ秒に立ち、macOS の
  # フルビルドが 2 本走っていた (保持期間ぶんの実測で余剰 198 本・19.6 時間)。
  #
  # **edited では base の変更だけで走らせる** (#1712)。edited は本文・タイトルの編集でも
  # 発火するが、そのとき検査する木は 1 バイトも変わらない (review-gate の都合で本文は
  # よく書き換わる)。base の変更だけは木を変える — このジョブの actions/checkout は ref を
  # 指定していないので pull_request では合流 ref (refs/pull/N/merge) を取り、base が
  # 変われば合流先が変わる。base の変更のときにだけ github.event.changes.base が載る
  # (本文・タイトルの編集では changes.body / changes.title だけ)。edited を types から
  # 外さないのは、review-gate / pr-title の再評価に要るためである (on: のコメント)。
  #
  # **runs-on は macos-26 に固定する** (#1985)。macos-latest は GitHub が次の世代へ切り替える
  # もので、切り替わった時点で下限 (ADR-0009 の macOS 26) の build/test が誰にも気付かれず
  # 無くなる。ここと release.yml の release-check は、下限で走らせる唯一のホストである
  # (専用機の render は上の世代で走る)。**下限を引き上げる (ADR-0009 を改訂する) ときは、
  # この 2 つの runs-on も同時に動かす。**
  #
  # **merge_group では build と test を外す** (#1985)。専用機の render が同じ合流後の木で
  # build / test / gpu-ran を、GPU 付きで走らせる (上位互換)。ここでも走らせると、週に約 145 本の
  # merge_group で約 9.7 分ずつ・約 23 時間のホストの macOS 時間が二重になり、ホストの macOS の
  # 同時実行枠 (5 本) を通して PR のランナー待ちに効いていた。下限の担保は PR の ci-check が
  # 担う (pull_request では CI_CHECK_SKIP が空で、build と test を macOS 26 で走らせる)。失うのは
  # 「main と合流させた木を macOS 26 で走らせる」部分だけで、合流して初めて壊れ、しかも 26 で
  # だけ出る赤は狭い。その赤は、版を出す前の release.yml の release-check (合流後の main を
  # macOS 26 で release に組む) が拾い、版を止める (#2662。merge の前には止まらない)。
  #
  # **examples / params / api / reference は合流後の木でも残す。** build を prerequisite に持つ
  # ので、build の段が無ければ最初の段が swift build を自分で走らせる (約 1.5 分。2 段目以降は
  # 何もしない)。これらは render が見ない検査で、合流して初めて赤になる組み合わせ (片方の PR が
  # API を改名し、もう片方が旧名の例を足す) を拾うのは merge queue の役目である。
  # 括弧を 1 段深くして pull_request の中に閉じ込めるのは、**merge_group に action の欄が
  # 無い**ためである。素直に並べると merge_group では null と文字列を突き合わせることに
  # なり、可否が式言語の型強制の解釈に乗る。外れたときの姿が「merge queue で ci-check が
  # 黙って走らない」なので、可否を決める比較は常に文字列同士にしておく — merge_group
  # では github.event_name != 'pull_request' が真になって短絡する。changes.base は
  # edited のときにしか評価されず、あれば object (真)、無ければ null (偽) である。
  ci-check:
    if: >-
      github.event_name != 'pull_request_review'
      && (github.event_name != 'pull_request'
      || (github.event.action != 'labeled'
      && github.event.action != 'unlabeled'
      && (github.event.action != 'edited' || github.event.changes.base)))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: make ci-check
        env:
          CI_CHECK_HOST: macos
          CI_CHECK_SKIP: ${{ github.event_name == 'merge_group' && 'build test' || '' }}

  # 木だけを読む段 (#2612)。SPDX の宣言漏れやリンク切れのような安い赤を、macOS の枠の待ちと
  # build・test の後ではなく、数分で返す。どの段をここへ出したかと理由は Makefile の
  # CI_STATIC_STEPS。保証の範囲は変えない — 同じ段を、同じ木で、先に走らせる。
  #
  # **起動の条件は ci-check と同じにする。** 片方だけが走る event があると、その event では
  # 段が抜ける (scripts/tests/ci_workflow_test.py が 2 つの if: の一致を見る)。merge_group でも
  # 走らせる — adrs の番号の重複のように、合流後の木で初めて赤になる段がここにも居る。
  #
  # **runs-on は ubuntu-24.04 に固定する。** ubuntu-latest は GitHub が切り替えるもので、
  # 切り替わると python3 や ruby (github-yaml-lint) の版が黙って動く (macos-26 を固定したのと
  # 同じ理由・#1985)。上げるときは scripts/ci-tools.txt を同じ python で組み直す。ADR-0009 の
  # 下限とは関係しない — 下限で走らせる唯一のホストは、上の ci-check と release.yml の
  # release-check のままである (ここの段は OS の版に依らない)。
  #
  # **GH_TOKEN を持ち込まない。** ci-check と同じく PR の中の任意のコード (Makefile・検査) を
  # 走らせるので、drawing-evidence の段は認証が無いと名乗って 0 で抜ける (本物の判定は下の
  # drawing-evidence のジョブ)。
  #
  # 道具は版と照合値で固定し、**照合値の無いものを 1 つも入れない**。reuse (と encoding 判定の
  # chardet・#48)・check-jsonschema は scripts/ci-tools.txt から入れる。あちらはホイールだけを
  # 許し、合うホイールの無い reuse 1 つだけを sdist から組む。組む道具 (poetry-core) は
  # --require-hashes が効かない build 依存なので、ci-tools-build.txt から照合値つきで先に入れ、
  # --no-build-isolation でそれを使わせる (理由は ci-tools.txt の冒頭。形は
  # scripts/tests/ci_workflow_test.py が見る)。actionlint と shellcheck は
  # scripts/check-workflows.sh が版と照合値を持って自分で落とす。venv の bin を丸ごと PATH に
  # 足すと python3 まで差し替わるので、使う 2 つだけを置き場に繋ぐ
  ci-static:
    if: >-
      github.event_name != 'pull_request_review'
      && (github.event_name != 'pull_request'
      || (github.event.action != 'labeled'
      && github.event.action != 'unlabeled'
      && (github.event.action != 'edited' || github.event.changes.base)))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/pip" install --quiet --require-hashes -r scripts/ci-tools-build.txt
          "$RUNNER_TEMP/ci-tools/bin/pip" install --quiet --require-hashes --no-build-isolation -r scripts/ci-tools.txt
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/reuse" "$RUNNER_TEMP/ci-tools/bin/check-jsonschema" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make ci-check
        env:
          CI_CHECK_HOST: ubuntu

  # PR タイトル = squash 後のコミットメッセージなので Conventional Commits を検査する。
  # merge_group にはタイトルが無いためスキップし、ci-gate 側は skipped を許容する。
  #
  # 承認でも走らせない (#623)。タイトルは承認では変わらず、編集は pull_request の
  # edited が拾う。
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if grep -qE '^(feat|fix|docs|refactor|test|chore|ci|perf|build)(\([^)]+\))?!?: .+' <<<"$TITLE"; then
            echo "ok: $TITLE"
          else
            echo "PR タイトルが Conventional Commits ではない: $TITLE" >&2
            echo '形式: <type>(<scope>): <要約>  (type: feat/fix/docs/refactor/test/chore/ci/perf/build)' >&2
            echo 'design は Issue Type であって type ではない。' >&2
            echo 'タイトルを直すと新しい run が走り pr-title は緑になるが、この run の赤い pr-title と、それを受けた赤い ci-gate は残って必須チェックを赤のままにする。' >&2
            echo 'この run は rerun しない (元のイベントを再生するので古いタイトルで判定し、同じ赤を返す — #699)。タイトルを直したうえで、新しいコミットを push して run を作り直す (空コミットでよい)。' >&2
            exit 1
          fi

  # ADR-0002 / ADR-0031 のマージ判定 (実体は scripts/review-gate.sh)。
  # 本文の編集・ラベルの付け外し・レビューの投稿で新しい run が走り、判定が付け直される
  # (先の run の赤い ci-gate までは消えない — ci-gate の上のコメント)。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  #
  # **終了コードは 0 か 1 だけである。** かつては承認待ちを 20 で表し、approval-signal
  # ジョブが human-approval の commit status へ回していたが (#111 / #256 / #282)、
  # ラベル由来の承認そのものを ADR-0031 が畳んだので、待つ状態が無くなった (#618)。
  # ルールセットも承認を要求しない (ADR-0044)。
  #
  # **判定するスクリプトは、既定ブランチ (main) の版を取って走らせる** (#2001・ADR-0031
  # 決定 2 の 2026-10-03 の改訂)。PR の版で走らせると、同じ PR の中で自分を裁く検査を
  # 書き換えて通れてしまう (承認なしでゲート本体を変えた PR は #1716 の集計で 6 本)。
  # スクリプトは PR の中身 (本文・ファイル一覧・AGENTS.md・Issue) をすべて API から読み、
  # 木から読むのは同じ scripts/ の共通部品と定義ファイルだけなので、PR の木は要らない。
  # ref を PR の base にしないのは、base は PR の側が選べるからである。
  #
  # **判定を変える PR の効き目は、merge の後の PR から始まる。** その PR 自身は前の版で
  # 裁かれる。ゲートが壊れていて、それを直す PR も同じゲートで赤になるときの脱出口は、
  # その PR の中でこのジョブの ref の行を外すことである。外した行は後続の PR で戻す。
  # 承認のゲートがあった頃は、この行を外すと人が一度通った。ADR-0044 が承認を外したので、
  # 外したことは PR の diff と着手前のプランにしか現れない (同 ADR の影響に書いた代償)。
  review-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: マージ判定
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/review-gate.sh "${{ github.event.pull_request.number }}"

  # 描画に触れる PR に**絵が載っていること**を要求する (#306)。
  #
  # 機械が見られるのは触っていない絵の退行だけで (専用機の render.yml・ADR-0019 決定 7)、
  # 新しい絵が正しいかの担い手は人間と AI の目である (ADR-0019 決定 1)。目に見せるものが無ければ担い手は働けず、
  # squash merge でブランチが消えた後には絵を足せない。それまで担保していたのは
  # PR テンプレートのコメント 1 行だけで、抜けたときに気付く経路が無かった。
  #
  # **GPU は要らない** — 変更ファイルの一覧と本文の文字列しか見ない。
  #
  # **ci-check ジョブには相乗りさせない。** あのジョブは PR の中の任意のコード
  # (Makefile・検査) を走らせるので、GH_TOKEN を持ち込まない。
  #
  # 本文を編集しても逃がしラベルを付け外ししても新しい run が走り、判定が付け直される
  # (on.pull_request.types に edited / labeled / unlabeled が入っている)。**ただし、赤かった
  # 先の run の ci-gate は消えない** (ci-gate の上のコメント)。逃がしラベルは PR の作成と
  # 同時に付けると、通常は最初の run から通る — 保証ではない (gh は PR を作ってからラベルを
  # 付けるので、まれに opened の run が先に API を読んで赤くなる。上の ci-check のコメント)
  # (#2134)。
  # merge_group では PR 文脈が無いためスキップし、ci-gate 側は skipped を許容する。
  #
  # **判定するスクリプトは既定ブランチの版で走らせる。** 理由と脱出口は review-gate と
  # 同じ (#2001)。PR の木は読まない — 変更ファイルの一覧も本文も API から取る。
  drawing-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 描画に触れる PR に絵があるか
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-drawing-evidence.sh

  # ブランチ保護が要求する必須チェックのうち、**CI の健全性**を表す 1 つ。
  # ジョブが増えても required checks の登録名はこの 1 つを保つ。
  #
  # かつてはもう 1 つ human-approval があり、「人の操作を待っているか」を別の名前で
  # 表していた (混ぜると監視が承認待ちを故障と誤検出する — #111)。ADR-0031 が
  # ラベル由来の承認を畳んで待つ状態そのものが無くなった (#618)。必須チェックは、
  # この ci-gate と、専用機の描画ジョブ render (render.yml・#878) と、PR の作法の pr-gate
  # (pr-gate.yml・#2668) の 3 本である (正本は .github/rulesets/main-protection.json。pr-gate が
  # 実設定で必須になるのはメンテナの適用の後で、作法の 3 ジョブをここから外すのは #2669)。
  # 手元の実行の報告 local-render は、render が合流後の木を直接描くようになって畳んだ
  # (#879)。
  #
  # **新しい run が走って緑になっても、赤い run の ci-gate は残る** (#2134)。
  # review-gate・drawing-evidence が赤だった run の ci-gate は、同じコミットに残って必須
  # チェックを赤のままにする。新しい run の ci-gate が緑でも、古い赤が必須チェックを固定する
  # ことがある (#259 の実測)。ラベルを数分以内に後付けする典型の場面では、先の run の ci-gate は
  # ci-check (macOS・約 10 分) を待って終わり、labeled の run は ci-check を飛ばして先に緑に
  # なる — 終わる順でも固定でも、赤が残る点は同じなので、機構は 1 つに断定しない。本文の編集・
  # ラベルの付け外し・レビューの却下が起こすのは判定の付け直しであって、必須チェックが緑に
  # なることではない。
  #
  # 消すのは、赤い run の失敗ジョブの打ち直し (gh run rerun <run-id> --failed) で、
  # review-gate と drawing-evidence は実行のたびに API から本文・ラベル・レビューを読むので
  # 打ち直せば通る。打たなくても stall-watch が数時間おきに打つ (scripts/stall-act.sh)。
  # ただし対象は同じリポジトリの Draft でない PR だけで (stall-watch.sh が isDraft と
  # isCrossRepository を外す)、fork の PR はメンテナが打つ。
  #
  # **pr-title の赤は打ち直しでは消えない。** 元のイベントを再生して古いタイトルで判定する
  # ので同じ赤を返し (#699)、先の run の赤い ci-gate も pr-title を受けて赤のままになる。
  # タイトルを直したうえで、新しいコミットを push して run を作り直す (head の sha が変わり、
  # 古い赤が丸ごと外れる)。
  #
  # 作成と同時に付ければ、通常は赤い run が出ない。差し戻しの文面はその形を先に案内する
  # (scripts/check-drawing-evidence.sh)。
  ci-gate:
    if: always()
    needs: [ci-check, ci-static, pr-title, review-gate, drawing-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # パイプにしない (#2609)。pipefail の下では、grep -q が一致して先に抜けたときに
          # 書き終えていない printf が SIGPIPE で落ち、if が偽 (= 落ちていない) と読む
          if grep -Eq '"result": *"(failure|cancelled)"' <<<"$RESULTS"; then
            echo "必須ジョブが落ちている" >&2
            exit 1
          fi

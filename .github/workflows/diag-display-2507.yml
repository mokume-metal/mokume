# 使い捨て (#2507): 専用機の画面が検査から見えるかを読み、眠っていれば起こしてみる。マージしない。
name: diag-display-2507
on:
  pull_request:
    types: [opened, synchronize]
    paths: [.github/workflows/diag-display-2507.yml]
permissions:
  contents: read
jobs:
  diag:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 10
    steps:
      - name: ジョブのユーザーと、画面の持ち主・切り替えの履歴を読む
        run: |
          mask() { sed "s#$HOME#~#g"; }
          echo "== job user"; id -un; id -u
          echo "== console owner"; stat -f'%Su %u' /dev/console
          echo "== sessions (who / last)"; who; last -20 | mask
          echo "== hardware displays (ioreg)"; ioreg -lw0 -r -c IOMobileFramebuffer 2>/dev/null | grep -i -E '"DisplayAttributes"|ProductName|external' | head -n 10 | cut -c1-300
          ioreg -lw0 | grep -i -E 'IODisplayConnect|AppleCLCD|DCPAVServiceProxy' | head -n 10 | cut -c1-200
          echo "== loginwindow / session switch log around the first failure (2026-10-12 12:00-14:00 JST)"
          log show --style compact --start "2026-10-12 12:00:00" --end "2026-10-12 14:00:00" --predicate 'process == "loginwindow" AND (eventMessage CONTAINS[c] "switch" OR eventMessage CONTAINS[c] "console" OR eventMessage CONTAINS[c] "logout" OR eventMessage CONTAINS[c] "login")' 2>&1 | tail -n 40 | mask
          echo "== display connect/disconnect log (2026-10-12 12:00-14:00 JST)"
          log show --style compact --start "2026-10-12 12:00:00" --end "2026-10-12 14:00:00" --predicate 'eventMessage CONTAINS[c] "hotplug" OR eventMessage CONTAINS[c] "display connected" OR eventMessage CONTAINS[c] "display disconnected"' 2>&1 | tail -n 30 | mask

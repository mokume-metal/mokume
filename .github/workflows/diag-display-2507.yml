# 使い捨て (#2507): 専用機の画面が検査から見えるかを読み、眠っていれば起こしてみる。マージしない。
name: diag-display-2507
on:
  pull_request:
    types: [opened, synchronize]
    paths: [.github/workflows/diag-display-2507.yml]
permissions:
  contents: read
jobs:
  diag:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 10
    steps:
      - name: 起動時刻・OS の版・自動ログイン・更新履歴を読む
        run: |
          echo "== now"; date
          echo "== boot"; sysctl -n kern.boottime; uptime
          echo "== sw_vers"; sw_vers
          echo "== autoLoginUser"; defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser 2>&1
          echo "== console owner / job user"; stat -f'%Su' /dev/console; id -un
          echo "== softwareupdate --history (tail)"; softwareupdate --history 2>&1 | tail -n 6

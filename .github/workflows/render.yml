# SPDX-FileCopyrightText: 2026 mokume-metal
# SPDX-License-Identifier: MIT
name: Render

# 描画を要する検査を、隔離した専用機の self-hosted runner で走らせる (#878・ADR-0019
# 決定 7)。GitHub ホストのランナーの仮想 GPU はこの世代のコマンド構造を持たないので、
# そこでは描画の検査が 1 本も走らない (#180)。
#
# **ci.yml と分けてある。** ci-gate とその依存は GitHub ホストのまま保ち、runs-on が
# 専用機を指すジョブをこのファイルだけに閉じ込める。専用機に何が届きうるかを、この
# ファイル 1 枚を読めば言えるようにするためである。
#
# **専用機に届くのは 3 つだけ** (ADR-0019 決定 7 の段階 A・B・D):
#   - merge_group — queue に入るのは write 権限を持つ人が入れたコードだけ
#   - 同じリポジトリの PR — そのブランチを作れるのは write 権限を持つ人だけ
#   - schedule — 走るのは既定ブランチ (main) の最新の定義とコードだけで、main のコードは
#     merge_group の queue を通ったものと同じ。入力を差し込む経路が無い (#1983)。
#     workflow_dispatch は足さない — 書き込み権限を持つ人が任意のブランチで起こせるので、
#     B に近い別の理由が要る
# **専用機に届く外のリポジトリのコードは、render-pr が clone する mokume-syphon の main
# だけである** (#1973・ADR-0019 決定 7 の追補 (2026-10-14))。mokume-syphon に runner は
# 登録しない — 別のリポジトリのジョブは下の門番に見えず、1 台に 1 ジョブずつの前提が崩れる (#1971)
# fork の PR は各ジョブの if で弾く。fork の PR はこのファイル自体を書き換えられるので、
# if だけでは止まらない。止めるのはリポジトリの設定 (外部の人の PR のワークフローは
# 毎回承認を要する・approval_policy: all_external_contributors) である。
#
# **必須チェックは render だけ。** render は merge_group でだけ走り、PR では skipped として
# 現れる。skipped は必須チェックを満たすので、PR を止めない。render-pr は PR の時点で
# 早く気付くための情報で、必須にしない — 専用機が混んでも merge が止まらないように
# するため (#878 の 2026-09-05 の決定)。
#
# **secrets を持たず、contents: read だけで走る。** 結論はこのジョブの成否そのものが
# check になるので、commit status を打つ token は要らない。
#
# 専用機の設置と、ジョブ開始時の掃除 (scripts/runner-job-started.sh) の置き方は
# そのスクリプトの冒頭にある。
#
# **記録は artifact に上げて持ち出す** (#1773)。専用機の作業ディレクトリは次のジョブが
# 消すので、上げなければ赤を読んで直す材料が行を落とすジョブのログしか残らない。
#   - render-record: 何が走ったかの正本 (xunit の記録)・test-log・test-vanished の材料・
#     段ごとの所要。成否によらず上げる
#   - ledger-shots: 台帳の全行の絵 (MOKUME_LEDGER_DUMP_DIR)。落ちた回だけ上げる — 台帳の
#     行が動いた回の after の絵で、書き換える前に目で見る (ADR-0019 決定 3)
#   - 落ちた回は、落ちた検査の文面と台帳の書き換え後の行 (案) を run の要約へ書く
# artifact は runner が持つ runtime の token で上げるので、contents: read のままで足りる。
# 保持は 14 日 — 赤を直すまでの材料で、恒久の証跡は PR に載せる絵が持つ。
# render と render-pr の step の並びは同じに保つ。違うのはジョブの if と concurrency と、
# render-pr だけが持つ最後の 2 step (例の絵の前後の比較・#1986 と、mokume-syphon の検査・#1973) である。
#
# **例の絵の前後の比較は render-pr だけが持つ** (#1986)。指紋 (// shot: N snippet=…) の材料は
# 例のコードと撮影設定だけで実装は入らないので、実装だけが変わって絵が古くなっても
# example-shots-check は緑のまま通る (#1454・#1625)。描画のパスに触れる PR で、base と head の
# 木の両方で例の絵を描き (scripts/example-shots.py --drift)、画素が変わった絵を annotation と
# run の要約で名指しする。**警告だけで、merge は止めない** — 撮り直して書き戻すには Gyazo の
# 鍵が要るが、専用機は secrets を持たない。render (merge_group) には足さない: 合流後の木へ
# 警告を出しても読む人がいないし、必須の検査の所要を延ばす。
#
# **定期の検査 (scheduled-*) は、専用機のジョブと起票のジョブで権限を分ける** (#1983)。
#   - scheduled-debug / scheduled-release — 専用機。contents: read・秘密なしのまま
#   - scheduled-report — GitHub ホスト。**issues: write を持つのは、これと
#     render-environment-report (下) の 2 つだけ**で、専用機のジョブの結論と記録の artifact を
#     読むだけ (ruleset-drift.yml と同じ形)
#
# **merge queue の render が前検査で落ちたら、render-environment-report が発信する** (#2588)。
# 専用機の環境が壊れていると (#2507)、render は PR の赤と見分けの付かない形で落ち続け、
# 誰にも届かない。前検査 (scripts/runner-preflight.sh) の理由を render の job の出力で受け、
# GitHub ホストから起票する。専用機のジョブは引き続き権限も秘密も持たない。定期の run の
# 前検査の赤は scheduled-report が起票するので、ここは merge_group だけを見る
# 範囲は debug の build・test・gpu-ran と、release の test・gpu-ran (Makefile の
# test-release-scheduled)。どちらも台帳を含む (#1736)。
# **1 本の長いジョブにしない。** release は debug の終了後に門番を通して queue へ入れ
# (needs)、その間に待っている render を先に通す。各 30 分。初回の run で所要と render の
# 待ちを測り、悪化していれば #1983 に戻って頻度か範囲を選び直す。
#
# **専用機へ積む順番は、GitHub ホストの門番 (render-turn) が決める** (#2062)。専用機は
# 1 台で、runner は queued の job を先着順に拾わない — queue の先頭の render が、後から
# 積まれた render-pr や後ろの group の render に抜かれ続け、期限 (60 分) で弾かれた。
# 拾う順は変えられないので、積む job を絞る。判断は scripts/render-turn.sh が持つ:
#   - render (merge_group) — 1 つ前の group の run が終わるまで積まない。group は queue の
#     順に 1 本ずつ専用機に載る
#   - render-pr — merge_group の run が 1 本でも残っていれば見送る (必須ではない)
#   - scheduled-* — merge_group の run が残っている間は待つ
# 門番の判断は積む前の 1 回だけで、queue が空いている間に積まれた job は後から group が
# できても引き下がらない。そのうち**まだ拾われていない render-pr は、group ができた瞬間に
# queue-sweep.yml が cancel する** (#2064)。scheduled-* は needs の鎖で 1 本ずつしか積まれ
# ないので退かせない (ADR-0019 決定 7)
# 門番は GitHub ホストにだけ置き、actions: read だけを持つ。専用機の job は引き続き権限も
# 秘密も持たない。**門番が赤でも専用機の job は走らせる (`!cancelled()`)。** needs が
# 落ちて render が skipped になると、skipped は必須チェックを満たしてしまう — 描かずに
# merge される。順番が乱れるほうが軽い。`always()` にしないのは、queue-sweep が cancel した
# 捨てられた group の run で render を専用機に積まないため。実測 (#2063): 門番が timeout
# しても render は走り、門番で待っている間に run を cancel すると render は skipped ではなく
# cancelled で終わる (必須を満たさない。#2062 より前と同じ)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # 6 時間おき (05:13 / 11:13 / 17:13 / 23:13 JST)。専用機は専用なので夜間に限らない。
    # 毎時 0 分は避ける (このリポジトリの慣習)。schedule は遅れたり間引かれたりする
    - cron: "13 2,8,14,20 * * *"

permissions:
  contents: read

# run: を pipefail 付きの bash で走らせる (#2609)。理由と固定は scripts/tests/workflow_pipe_test.py
defaults:
  run:
    shell: bash

jobs:
  # 専用機へ積む順番を決める門番 (#2062・上の「専用機へ積む順番」)。待つ上限は
  # render-turn.sh が持つ (merge_group は前の group が終わるまで・schedule は 60 分)。
  # timeout は最後の歯止めで、queue の期限 (60 分) より外に置く
  render-turn:
    if: >-
      github.event_name == 'merge_group'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read # checkout
      actions: read # merge queue の render の run を読む
    outputs:
      go: ${{ steps.turn.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - id: turn
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          case "$EVENT" in
            merge_group) bash scripts/render-turn.sh merge_group "$BASE_SHA" "$BASE_REF" ;;
            pull_request) bash scripts/render-turn.sh yield ;;
            schedule) bash scripts/render-turn.sh wait ;;
          esac

  render:
    needs: render-turn
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    # 前検査で落ちたときの理由。render-environment-report が読む (#2588)
    outputs:
      preflight-reason: ${{ steps.preflight.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      # 検査を走らせられる環境かを先に数秒で見る (#2588)。表の GUI セッションが替わると
      # runner から画面が 0 枚に見え、make は 14 分走ってから窓の検査で落ちる (#2507)。
      # 落ちたら理由を job の出力へ上げ、render-environment-report が発信する
      - id: preflight
        run: bash scripts/runner-preflight.sh
      # build と test だけを走らせる。ほかの段 (lint・文書・hooks の検査・examples など) は
      # GitHub ホストの ci-check と ci-static が同じ木で走らせている。ただし merge_group のホストの
      # ci-check は build と test を外している (ci.yml の ci-check のコメント・#1985) —
      # 合流後の木の build / test は、この専用機だけが走らせる。gpu-ran は、描画の検査が
      # 「GPU が見えないので全部飛ばした」まま緑になるのを止める。
      #
      # CI= は Metal の検証レイヤを手元と同じく有効にするため (Makefile の
      # METAL_VALIDATION)。GitHub が立てる CI=true のままだと、検証レイヤが切れる。
      - run: make ci-check CI_CHECK_STEPS="build test gpu-ran" CI=
        env:
          MOKUME_LEDGER_DUMP_DIR: ${{ github.workspace }}/.build/ledger-shots
      - name: 落ちた検査の文面を要約へ書く
        if: failure()
        run: python3 scripts/read-test-record.py --failure-messages .build/test-results-swift-testing.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-record
          path: |
            .build/test-results-swift-testing.xml
            .build/test-log.txt
            .build/test-vanished/
            .build/ci-check-durations.tsv
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ledger-shots
          path: .build/ledger-shots/
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

  # merge queue の render が前検査で落ちたことを発信する (#2588・冒頭の説明)。前検査を
  # 通って検査で落ちた回は reason が空なので走らない — それは PR の赤である
  render-environment-report:
    needs: render
    if: ${{ !cancelled() && needs.render.result == 'failure' && needs.render.outputs.preflight-reason != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      issues: write # 専用機の環境の故障の起票 (#2588)
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.render.outputs.preflight-reason }}
        run: bash scripts/report-runner-environment.sh "$REASON"

  render-pr:
    needs: render-turn
    # 門番が見送ったときだけ外す。門番が赤なら走らせる (go が空になる)
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.render-turn.outputs.go != 'false'
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    # 同じ PR へ push し直したら、古い実行は捨てる。専用機は 1 台なので、古い木の検査で
    # 塞がないようにする
    concurrency:
      group: render-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request の木は合流 ref (refs/pull/N/merge) で、HEAD^1 が base・HEAD が head
          # (この PR を足した後の木)。例の絵の前後の比較が HEAD^1 を取り出すのに要る
          fetch-depth: 2
      # 検査を走らせられる環境かを先に見る (#2588。render と同じ)
      - id: preflight
        run: bash scripts/runner-preflight.sh
      - run: make ci-check CI_CHECK_STEPS="build test gpu-ran" CI=
        env:
          MOKUME_LEDGER_DUMP_DIR: ${{ github.workspace }}/.build/ledger-shots
          HANG_PROBE_KEEP_ANIMATIONS: "1"
      - name: 落ちた検査の文面を要約へ書く
        if: failure()
        run: python3 scripts/read-test-record.py --failure-messages .build/test-results-swift-testing.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-record
          path: |
            .build/test-results-swift-testing.xml
            .build/test-log.txt
            .build/test-vanished/
            .build/ci-check-durations.tsv
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ledger-shots
          path: .build/ledger-shots/
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      # 例の絵を前後の木で描き比べる (#1986)。**警告だけ** — 描けなかったときも job は赤に
      # しない (continue-on-error)。専用機の job は secrets も token も持ち込まない (ADR-0019
      # 決定 7) ので、変更ファイルは GitHub の API ではなく、合流 commit の 2 つの親の差から
      # 取る (scripts/pr-files.sh の `gh api` は GH_TOKEN が要る)。取りこぼしは無い — 大きな
      # PR で後半が落ちる (#793) のは GraphQL の上限で、git の差には当たらない。
      # 照合は check-drawing-evidence.sh と同じ drawing-paths.sh の 1 つを読む
      #
      # **手前の検査が赤でも走らせる (`!cancelled()`)。** 実装で絵が変わる PR は、台帳や
      # 描画の検査も同じ根で赤くなる。そこで止めると、赤を直して push し直すまで名指しが
      # 出ず、専用機の 1 周 (7 分ほど) を余計に回すことになる
      - name: 例の絵を前後の木で描き比べる (警告のみ)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          . scripts/drawing-paths.sh
          files=$(git diff --name-only HEAD^1 HEAD)
          if ! touches_drawing <<<"$files"; then
            echo "描画のパスに触れていないので、例の絵は比べない"
            exit 0
          fi
          python3 scripts/example-shots.py --drift HEAD^1
      # 本体の PR が外のパッケージ mokume-syphon を壊したかを知らせる (#1973)。mokume-syphon の
      # main をこの木に向けて組み、GPU の検査まで走らせる。落ちたときだけ base の木 (HEAD^1) でも
      # 走らせ、「この PR が壊した」と「前から壊れている」を分ける。**警告だけで、merge は止めない**
      # (continue-on-error・render-pr は必須でもない)。ライブラリ (Sources/・Package.swift) に
      # 触れない PR では走らない。判断は scripts/syphon-check-pr.sh が持つ
      #
      # **手前の検査が赤でも走らせる (`!cancelled()`)。** 本体の検査の赤と mokume-syphon の赤は
      # 別の問いで、片方で止めると、もう片方を知るのに専用機の 1 周を余計に回す
      - name: mokume-syphon をこの木で組んで検査する (警告のみ)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/syphon-check-pr.sh

  scheduled-debug:
    needs: render-turn
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    # 同じ定期の run が重ならないようにする。古いものは捨てずに待つ
    concurrency:
      group: render-scheduled-debug
      cancel-in-progress: false
    # 入力を生成する検査 (Tests/MokumeProbe・#3207) は、PR・queue では固定の seed で回し、
    # 新しい seed と多い件数はこの定期の検査だけで回す (#3207 の判断 2)。赤の文面が名乗る seed を
    # MOKUME_PROBE_SEED に渡せば、同じ入力の 1 件だけを再現できる。step は render / render-pr と
    # 揃える約束 (render_workflow_test.py の 13) なので、違いはジョブの env に置く。倍率は、この
    # ジョブの枠 (30 分) の残り 8〜12 分に増分が収まる値に置く (#3216)
    env:
      MOKUME_PROBE_FRESH: "1"
      MOKUME_PROBE_SCALE: "4"
    steps:
      - uses: actions/checkout@v7
      # 検査を走らせられる環境かを先に見る (#2588。render と同じ)
      - id: preflight
        run: bash scripts/runner-preflight.sh
      - run: make ci-check CI_CHECK_STEPS="build test gpu-ran" CI=
        env:
          MOKUME_LEDGER_DUMP_DIR: ${{ github.workspace }}/.build/ledger-shots
      - name: 落ちた検査の文面を要約へ書く
        if: failure()
        run: python3 scripts/read-test-record.py --failure-messages .build/test-results-swift-testing.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduled-debug-record
          path: |
            .build/test-results-swift-testing.xml
            .build/test-log.txt
            .build/test-vanished/
            .build/ci-check-durations.tsv
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: scheduled-debug-ledger-shots
          path: .build/ledger-shots/
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

  # debug の後に、もう一度 merge queue の render を先に通す (上の「専用機へ積む順番」)
  scheduled-release-turn:
    needs: scheduled-debug
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read # checkout
      actions: read # merge queue の render の run を読む
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/render-turn.sh wait

  scheduled-release:
    # debug が赤でも release は走らせる (別の赤を覆い隠さない)。needs は順序のためで、
    # この job は debug が終わり、門番を通ってから queue に入る (上の「1 本の長いジョブに
    # しない」)
    needs: [scheduled-debug, scheduled-release-turn]
    # always() にしない: cancel された定期の run で専用機に積まない (render と同じ理由)
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    concurrency:
      group: render-scheduled-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # 検査を走らせられる環境かを先に見る (#2588。render と同じ)
      - id: preflight
        run: bash scripts/runner-preflight.sh
      # 検査の端末出力は行を落とす (#1056) ので正本は xunit の記録だが、落ちた理由を読む
      # 手がかりとして起票の本文へ末尾を載せるため、test-log へ写しを残す
      - run: |
          mkdir -p .build
          make test-release-scheduled CI= 2>&1 | tee .build/test-log.txt
      - name: 落ちた検査の文面を要約へ書く
        if: failure()
        run: python3 scripts/read-test-record.py --failure-messages .build/test-results-release-swift-testing.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduled-release-record
          path: |
            .build/test-results-release-swift-testing.xml
            .build/test-log.txt
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

  # 緑で終わらなかった回を起票する。落ちた (failure) 回に加え、切れた (cancelled) 回も
  # 起票する — 30 分の timeout で切れた job は cancelled で終わり、failure だけを見ると
  # 何も起票されずに黙って抜けた (#2084)。切れる経路 (timeout・人の cancel・concurrency の
  # 置き換え) は見分けず、本文がそのどれかと名乗る (ADR-0019 決定 7)。`!=` で書かない:
  # skipped で起票する。always() を外さない: 暗黙の success() が足され、needs が赤の回に
  # この job が skipped になる
  scheduled-report:
    needs: [scheduled-debug, scheduled-release]
    if: >-
      always()
      && (needs.scheduled-debug.result == 'failure' || needs.scheduled-release.result == 'failure'
          || needs.scheduled-debug.result == 'cancelled' || needs.scheduled-release.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      issues: write # 赤のときの起票 (#1983)
    steps:
      - uses: actions/checkout@v7
      # ビルドで落ちて記録が上がらなかった回も起票する。artifact が無くても止まらない
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: scheduled-debug-record
          path: record/debug
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: scheduled-release-record
          path: record/release
      # 上げた記録の置き場所は、上げたファイルの共通の親で決まる (.build/ が付くか付かないかが
      # 中身で変わる) ので、位置を決め打たず名前で探す。無ければ無いパスを渡し、呼び先が
      # 「記録が無い」と名乗って起票する。記録が無い理由 (落ちた・切れた) は job の結論で
      # 変わるので、結論も渡す
      - name: 赤を発信する
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_RESULT: ${{ needs.scheduled-debug.result }}
          RELEASE_RESULT: ${{ needs.scheduled-release.result }}
        run: |
          find_one() { find "$1" -name "$2" -print -quit 2>/dev/null || true; }
          debug_xml=$(find_one record/debug test-results-swift-testing.xml)
          debug_log=$(find_one record/debug test-log.txt)
          release_xml=$(find_one record/release test-results-release-swift-testing.xml)
          release_log=$(find_one record/release test-log.txt)
          bash scripts/report-scheduled-render.sh \
            "$DEBUG_RESULT" "${debug_xml:-record/debug/none.xml}" "${debug_log:-record/debug/none.txt}" \
            "$RELEASE_RESULT" "${release_xml:-record/release/none.xml}" "${release_log:-record/release/none.txt}"

name: Render

# 描画を要する検査を、隔離した専用機の self-hosted runner で走らせる (#878・ADR-0019
# 決定 7)。GitHub ホストのランナーの仮想 GPU はこの世代のコマンド構造を持たないので、
# そこでは描画の検査が 1 本も走らない (#180)。
#
# **ci.yml と分けてある。** ci-gate とその依存は GitHub ホストのまま保ち、runs-on が
# 専用機を指すジョブをこのファイルだけに閉じ込める。専用機に何が届きうるかを、この
# ファイル 1 枚を読めば言えるようにするためである。
#
# **専用機に届くのは 2 つだけ** (ADR-0019 決定 7 の段階 A・B):
#   - merge_group — queue に入るのは write 権限を持つ人が入れたコードだけ
#   - 同じリポジトリの PR — そのブランチを作れるのは write 権限を持つ人だけ
# fork の PR は各ジョブの if で弾く。fork の PR はこのファイル自体を書き換えられるので、
# if だけでは止まらない。止めるのはリポジトリの設定 (外部の人の PR のワークフローは
# 毎回承認を要する・approval_policy: all_external_contributors) である。
#
# **必須チェックは render だけ。** render は merge_group でだけ走り、PR では skipped として
# 現れる。skipped は必須チェックを満たすので、PR を止めない。render-pr は PR の時点で
# 早く気付くための情報で、必須にしない — 専用機が混んでも merge が止まらないように
# するため (#878 の 2026-09-05 の決定)。
#
# **secrets を持たず、contents: read だけで走る。** 結論はこのジョブの成否そのものが
# check になるので、commit status を打つ token は要らない。
#
# 専用機の設置と、ジョブ開始時の掃除 (scripts/runner-job-started.sh) の置き方は
# そのスクリプトの冒頭にある。
#
# **記録は artifact に上げて持ち出す** (#1773)。専用機の作業ディレクトリは次のジョブが
# 消すので、上げなければ赤を読んで直す材料が行を落とすジョブのログしか残らない。
#   - render-record: 何が走ったかの正本 (xunit の記録)・test-log・test-vanished の材料・
#     段ごとの所要。成否によらず上げる
#   - ledger-shots: 台帳の全行の絵 (MOKUME_LEDGER_DUMP_DIR)。落ちた回だけ上げる — 台帳の
#     行が動いた回の after の絵で、書き換える前に目で見る (ADR-0019 決定 3)
#   - 落ちた回は、落ちた検査の文面と台帳の書き換え後の行 (案) を run の要約へ書く
# artifact は runner が持つ runtime の token で上げるので、contents: read のままで足りる。
# 保持は 14 日 — 赤を直すまでの材料で、恒久の証跡は PR に載せる絵が持つ。
# render と render-pr の step の並びは同じに保つ。違うのはジョブの if と concurrency と、
# render-pr だけが持つ最後の 1 step (例の絵の前後の比較・#1986) である。
#
# **例の絵の前後の比較は render-pr だけが持つ** (#1986)。指紋 (// shot: N snippet=…) の材料は
# 例のコードと撮影設定だけで実装は入らないので、実装だけが変わって絵が古くなっても
# example-shots-check は緑のまま通る (#1454・#1625)。描画のパスに触れる PR で、base と head の
# 木の両方で例の絵を描き (scripts/example-shots.py --drift)、画素が変わった絵を annotation と
# run の要約で名指しする。**警告だけで、merge は止めない** — 撮り直して書き戻すには Gyazo の
# 鍵が要るが、専用機は secrets を持たない。render (merge_group) には足さない: 合流後の木へ
# 警告を出しても読む人がいないし、必須の検査の所要を延ばす。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  render:
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # build と test だけを走らせる。ほかの段 (lint・文書・hooks の検査) は GitHub ホストの
      # ci-check が同じ木で走らせている。gpu-ran は、描画の検査が「GPU が見えないので
      # 全部飛ばした」まま緑になるのを止める。
      #
      # CI= は Metal の検証レイヤを手元と同じく有効にするため (Makefile の
      # METAL_VALIDATION)。GitHub が立てる CI=true のままだと、検証レイヤが切れる。
      - run: make ci-check CI_CHECK_STEPS="build test gpu-ran" CI=
        env:
          MOKUME_LEDGER_DUMP_DIR: ${{ github.workspace }}/.build/ledger-shots
      - name: 落ちた検査の文面を要約へ書く
        if: failure()
        run: python3 scripts/read-test-record.py --failure-messages .build/test-results-swift-testing.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-record
          path: |
            .build/test-results-swift-testing.xml
            .build/test-log.txt
            .build/test-vanished/
            .build/ci-check-durations.tsv
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ledger-shots
          path: .build/ledger-shots/
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

  render-pr:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: [self-hosted, mokume-render]
    timeout-minutes: 30
    # 同じ PR へ push し直したら、古い実行は捨てる。専用機は 1 台なので、古い木の検査で
    # 塞がないようにする
    concurrency:
      group: render-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request の木は合流 ref (refs/pull/N/merge) で、HEAD^1 が base・HEAD が head
          # (この PR を足した後の木)。例の絵の前後の比較が HEAD^1 を取り出すのに要る
          fetch-depth: 2
      - run: make ci-check CI_CHECK_STEPS="build test gpu-ran" CI=
        env:
          MOKUME_LEDGER_DUMP_DIR: ${{ github.workspace }}/.build/ledger-shots
      - name: 落ちた検査の文面を要約へ書く
        if: failure()
        run: python3 scripts/read-test-record.py --failure-messages .build/test-results-swift-testing.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-record
          path: |
            .build/test-results-swift-testing.xml
            .build/test-log.txt
            .build/test-vanished/
            .build/ci-check-durations.tsv
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ledger-shots
          path: .build/ledger-shots/
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14
      # 例の絵を前後の木で描き比べる (#1986)。**警告だけ** — 描けなかったときも job は赤に
      # しない (continue-on-error)。専用機の job は secrets も token も持ち込まない (ADR-0019
      # 決定 7) ので、変更ファイルは GitHub の API ではなく、合流 commit の 2 つの親の差から
      # 取る (scripts/pr-files.sh の `gh api` は GH_TOKEN が要る)。取りこぼしは無い — 大きな
      # PR で後半が落ちる (#793) のは GraphQL の上限で、git の差には当たらない。
      # 照合は check-drawing-evidence.sh と同じ drawing-paths.sh の 1 つを読む
      #
      # **手前の検査が赤でも走らせる (`!cancelled()`)。** 実装で絵が変わる PR は、台帳や
      # 描画の検査も同じ根で赤くなる。そこで止めると、赤を直して push し直すまで名指しが
      # 出ず、専用機の 1 周 (7 分ほど) を余計に回すことになる
      - name: 例の絵を前後の木で描き比べる (警告のみ)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          . scripts/drawing-paths.sh
          files=$(git diff --name-only HEAD^1 HEAD)
          if ! touches_drawing <<<"$files"; then
            echo "描画のパスに触れていないので、例の絵は比べない"
            exit 0
          fi
          python3 scripts/example-shots.py --drift HEAD^1

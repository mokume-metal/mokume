name: Host scheduled

# GitHub ホストの macOS で、**merge の前には重すぎる検査**を定期に回す置き場 (#3220)。
# 検査ごとに「走らせる job」と「結果を発信する job」の 2 本を置く (tsan と tsan-report、
# 変異の mutation と mutation-report #3221)。後から足す検査も、同じ形の 2 本をこのファイルへ足す —
# workflow を検査ごとに増やさない (起動の時刻・権限の分け方・起票の形を 1 箇所で読めるようにするため)。
# tsan-report は赤の回だけ起票し、mutation-report は緑の回も点数を置く。
#
# **専用機 (render.yml) には載せない。** 専用機の定期は描画の検査のためのもので、schedule で
# 起動する専用機の job は scheduled-debug / scheduled-release に限っている (ADR-0019 決定 7・
# scripts/tests/render_workflow_test.py の約束 10)。ここの検査は GPU を要さない。
#
# **release.yml の release-check には足さない。** あちらは版の関門で、赤なら版が出ない。
# TSan の赤 (誤報を含む) で版を止める理由は無く、release の計測の器に sanitizer の費用も
# 乗せたくない。止めたいものが違うので、関門の外に置く。
#
# ホストの macOS は公開リポジトリでは従量課金が無いが、同時 5 本の枠を PR の ci-check と
# 分け合う。PR の少ない時間帯に置き、各 job に timeout-minutes を持たせて枠を塞がない。

on:
  schedule:
    # 日次 19:29 UTC (≒ 04:29 JST)。毎時 0 分を外し、他の定期 (release の 01:41・
    # ruleset-drift の 03:17・publication の 04:23・render の 2,8,14,20 時 13 分・
    # stall-watch の 7,22,37,52 分) とも重ねない
    - cron: "29 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# run: を pipefail 付きの bash で走らせる (#2609)。理由と固定は scripts/tests/workflow_pipe_test.py
defaults:
  run:
    shell: bash

jobs:
  # ThreadSanitizer で組んだ CPU の suite を回す (#3220)。塞ぐ実害は #2916 — SampleRing の
  # データ競合を、値の整合しか見ない検査が緑のまま通した。範囲の正本は Makefile の test-tsan。
  #
  # **runs-on は macos-26 (ADR-0009 の下限) にする。** ホストでは RenderDevice.isAvailable が
  # 偽で描画の検査が飛び、Metal の内部での TSan の誤報 (#1772 の懸念) も避けられる。
  # **continue-on-error を付けない** — 赤が success に化けると起票の job が走らない。
  tsan:
    runs-on: macos-26
    # 実測は 31.6 分と 40 分 (組み立て 8〜12 分・実行 25〜30 分・#3220 の PR)。揺れの上に余裕を
    # 持たせる。既定 (360 分) のまま止まると、ホストの macOS の枠を塞ぐ
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # 端末出力は make が .build/test-log-tsan.txt に残す (起票の本文が TSan の報告を抜く)
      - name: TSan で検査する
        run: |
          started=$(date +%s)
          set +e
          make test-tsan
          status=$?
          set -e
          printf '### TSan の検査の所要\n\n%d 秒 (組み立てと実行・終了コード %d)\n\n' \
            "$(( $(date +%s) - started ))" "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tsan-record
          path: |
            .build/test-results-tsan-swift-testing.xml
            .build/test-events-tsan.jsonl
            .build/test-log-tsan.txt
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

  # 緑で終わらなかった tsan を起票する (または開いた Issue へ追記する)。
  # **issues: write を持つのはこのジョブだけ**で、検査のコードを走らせる tsan には持たせない
  # (release.yml の release-check-report と同じ分け方)。落ちた (failure) 回に加え、切れた
  # (cancelled) 回も起票する。`!=` で書かない: skipped で起票する。always() を外さない:
  # 暗黙の success() が足され、赤の回に skipped になる
  tsan-report:
    needs: tsan
    if: >-
      always()
      && (needs.tsan.result == 'failure' || needs.tsan.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      issues: write # 赤のときの起票 (#3220)
    steps:
      - uses: actions/checkout@v7
      # ビルドで落ちて記録が上がらなかった回も起票する。artifact が無くても止まらない
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: tsan-record
          path: record
      # 置き場所は上げたファイルの共通の親で決まるので、名前で探す (release.yml と同じ)
      - name: 赤を発信する
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.tsan.result }}
        run: |
          find_one() { find "$1" -name "$2" -print -quit 2>/dev/null || true; }
          xml=$(find_one record test-results-tsan-swift-testing.xml)
          log=$(find_one record test-log-tsan.txt)
          bash scripts/report-tsan.sh "$RESULT" "${xml:-record/none.xml}" "${log:-record/none.txt}"

  # 検査の検証力を測る (#3221)。実装を 1 か所ずつ壊し、関連の検査が赤になるかを見る
  # (scripts/mutate.py)。塞ぐ実害は #3207 — 検査の提案を一括で入れても、どれが効いたかが
  # 後から引けない。固定の束 (Tests/mutation-bundle.json) と、前回の点数の commit から HEAD までに
  # 変わった行を、全体の期限の内側で回し、回しきれなかった数を名乗る。
  #
  # **点数の低下では赤にしない** (測るための job で、止める関門ではない)。赤にするのは、記録が
  # 読めない回 (`mutate.py summary` が unreadable を返す・build が組めない) だけ — 読めない回を
  # 緑に読ませると、検査の検証力が落ちても誰も気付かない。点数・帰属・新しい生き残りを追跡用の
  # Issue へ置くのは mutation-report (scripts/report-mutation.py)。
  #
  # **GPU の suite はホストで飛ぶ** (RenderDevice.isAvailable が偽)。その分の変異は `未評価` と名乗り、
  # 殺せなかったとは数えない (2026-10-30 の決定・#3221)。
  #
  # **前回の点数の commit は追跡用の Issue の本文から読む** (`issues: read` だけを持つ)。履歴は
  # fetch-depth 0 で取る。**continue-on-error を付けない** — 赤が success に化けると報告が読み違える。
  mutation:
    runs-on: macos-26
    # 仮の値 (実測前)。内訳: 束の予算 90 分 + 範囲の予算 60 分 + 1 件の期限 (10 分) が予算の最後に
    # はみ出す分 + 組み立て。push 後の workflow_dispatch の実測で直す
    timeout-minutes: 240
    permissions:
      contents: read
      issues: read # 前回の点数の commit を追跡用の Issue から読む
    outputs:
      since: ${{ steps.previous.outputs.since }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 範囲を回す起点。読めない・木に無いときは範囲を回さず、そう名乗る (束は回る)
      - name: 前回の点数の commit を読む
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=
          if prev=$(python3 scripts/mutation_state.py previous); then
            if [ -z "$prev" ]; then
              note="前回の点数の commit が無い (最初の回)。範囲は回さず、束を回して起点を置く"
            elif git cat-file -e "$prev^{commit}" 2>/dev/null; then
              since=$prev
              note="範囲の起点は前回の点数の commit \`${prev:0:12}\`"
            else
              note="前回の点数の commit \`${prev:0:12}\` がこの木に無い (履歴の書き換えか)。範囲は回さない"
            fi
          else
            note="追跡用の Issue から前回の commit を読めなかった。範囲は回さない"
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          printf '### 変異の検査の範囲\n\n%s\n\n' "$note" >> "$GITHUB_STEP_SUMMARY"
      - name: 固定の束を回す
        run: |
          python3 scripts/mutate.py run --bundle Tests/mutation-bundle.json \
            --out .build/mutation-bundle.json --work .build/mutation-bundle-work \
            --budget 5400 --timeout 600
      - name: 前回の点数の commit からの範囲を回す
        if: ${{ !cancelled() && steps.previous.outputs.since != '' }}
        env:
          SINCE: ${{ steps.previous.outputs.since }}
        run: |
          python3 scripts/mutate.py run --since "$SINCE" \
            --out .build/mutation-range.json --work .build/mutation-range-work \
            --budget 3600 --timeout 600
      # 読めない記録は unreadable と名乗って赤になる。job の要約にも載る
      - name: 要約 (固定の束)
        if: ${{ !cancelled() }}
        run: python3 scripts/mutate.py summary .build/mutation-bundle.json
      - name: 要約 (範囲)
        if: ${{ !cancelled() && steps.previous.outputs.since != '' }}
        run: python3 scripts/mutate.py summary .build/mutation-range.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-record
          path: |
            .build/mutation-bundle.json
            .build/mutation-range.json
            .build/mutation-bundle-work/mutate-log.txt
            .build/mutation-range-work/mutate-log.txt
          if-no-files-found: ignore
          # .build は隠しディレクトリで、v4.4 以降の既定では中身が 1 つも上がらない
          include-hidden-files: true
          retention-days: 14

  # 変異の点数・帰属・新しい生き残りを、固定タイトルの追跡用 Issue に置く (#3221)。
  # 本文の機械の区画を書き換える (通知しない)。コメントするのは新しい生き残りと、記録が読めなく
  # なった回だけ。**緑の回も走る** (点数を置くのが仕事なので) — `always()` を外さない:
  # 暗黙の success() が足され、mutation が赤の回に skipped になって、読めない回が黙る。
  # **issues: write を持つのはこのジョブだけ**で、検査のコードを走らせる mutation には持たせない。
  mutation-report:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      issues: write # 追跡用 Issue の起票・本文の書き換え・コメント (#3221)
    steps:
      - uses: actions/checkout@v7
      # 組み立てで落ちて記録が上がらなかった回も報告する。artifact が無くても止まらない
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-record
          path: record
      # 置き場所は上げたファイルの共通の親で決まるので、名前で探す (tsan-report と同じ)
      - name: 点数を追跡用の Issue に置く
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.mutation.result }}
          SINCE: ${{ needs.mutation.outputs.since }}
        run: |
          find_one() { find "$1" -name "$2" -print -quit 2>/dev/null || true; }
          bundle=$(find_one record mutation-bundle.json)
          range=$(find_one record mutation-range.json)
          python3 scripts/report-mutation.py --result "$RESULT" \
            --bundle "${bundle:-record/none-bundle.json}" \
            --range "${range:-record/none-range.json}" --range-since "$SINCE"
